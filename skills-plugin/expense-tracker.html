// ATTACHMENT HANDLING
// ═══════════════════════════════════════════════════════════════
function readFileB64(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file);});}

async function makeThumbnail(b64,maxW,maxH){maxW=maxW||80;maxH=maxH||72;return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas'),ctx=c.getContext('2d');let w=img.width,h=img.height;const ratio=Math.min(maxW/w,maxH/h);w*=ratio;h*=ratio;c.width=w;c.height=h;ctx.drawImage(img,0,0,w,h);res(c.toDataURL('image/jpeg',0.7));};img.onerror=rej;img.src=b64;});}

async function handleAttach(idx,ev){
  const files=ev.target.files;if(!files||!files.length)return;
  const valid=['image/jpeg','image/png','application/pdf'];
  const exp=S.editingExpenses[idx];if(!exp||!exp.transactionId)return;
  const errors=[];
  for(const file of files){
    if(!valid.includes(file.type)){errors.push(file.name+': unsupported type');continue;}
    if(file.size>5*1024*1024){errors.push(file.name+': exceeds 5 MB');continue;}
    try{
      const data=await readFileB64(file);
      const att={id:uid(),txnId:exp.transactionId,name:file.name,type:file.type,size:file.size,data:data,thumb:null};
      if(file.type.startsWith('image/'))att.thumb=await makeThumbnail(data);
      await ATT.save(att);
    }catch(e){errors.push(file.name+': '+e.message);}
  }
  ev.target.value='';
  loadAttList(idx,exp.transactionId);
  if(errors.length)alert('Some files could not be attached:\n'+errors.join('\n'));
  // Trigger OCR on attachment (soft mode — only fills empty fields)
  triggerOCR(idx,true);
}

async function triggerOCR(idx,softMode){
  // softMode=true: only fill empty fields (auto on new attach); false/undefined: overwrite (manual Scan OCR)
  const exp=S.editingExpenses[idx];if(!exp||!exp.transactionId)return;
  if(!window.Tesseract){alert('OCR library (Tesseract.js) not loaded yet. Please check your internet and reload.');return;}
  if(exp._ocrProcessing)return;
  exp._ocrProcessing=true;renderExpCards();
  try{
    const atts=await ATT.getByTxn(exp.transactionId);
    if(!atts.length){exp._ocrProcessing=false;alert('No attachments found. Attach an invoice/receipt first.');renderExpCards();return;}
    let vatData=null;
    for(const att of atts){
      vatData=await ocrExtractVAT(att.data,att.type);
      if(vatData)break;
    }
    exp._ocrProcessing=false;
    if(vatData&&vatData.vatLines&&vatData.vatLines.length){
      if(!exp.vatLines)exp.vatLines=[];
      if(!softMode||!exp.vatLines.length){
        // Overwrite (manual) or fill empty
        exp.vatLines=vatData.vatLines.map(vl=>({rate:vl.rate,net:vl.net,vat:vl.vat}));
        // If any line has rate but no net, calculate from total
        if(exp.vatLines.length===1&&exp.vatLines[0].net==null&&exp.vatLines[0].rate!=null&&exp.amount>0){
          const r=exp.vatLines[0].rate;
          exp.vatLines[0].net=Math.round(exp.amount/(1+r/100)*100)/100;
          exp.vatLines[0].vat=Math.round((exp.amount-exp.vatLines[0].net)*100)/100;
        }
      }
      exp._ocrDone=true;
    } else if(!softMode){
      alert('OCR could not detect VAT info from the attachment. You can fill in the fields manually.');
    }
    renderExpCards();
  }catch(e){
    console.error('OCR trigger error:',e);
    exp._ocrProcessing=false;renderExpCards();
    if(!softMode)alert('OCR error: '+e.message);
  }
}

async function loadAttList(idx,txnId){
  const el=document.getElementById('attList_'+idx);if(!el)return;
  if(!ATT._ready){el.innerHTML='<span class="text-xs text-gray-400">Storage initializing...</span>';return;}
  try{
    const items=await ATT.getByTxn(txnId);
    if(!items.length){el.innerHTML='<span class="text-xs text-gray-400">No attachments</span>';return;}
    el.innerHTML=items.map(a=>{
      const isImg=a.type.startsWith('image/');
      return`<div class="attachment-item">
        ${isImg&&a.thumb?`<img src="${a.thumb}" class="attachment-thumbnail" title="${esc(a.name)}" onclick="previewAtt('${a.id}')">`:`<div class="attachment-pdf-badge" title="${esc(a.name)}" onclick="previewAtt('${a.id}')">PDF</div>`}
        <div class="attachment-name" title="${esc(a.name)}">${esc(a.name)}</div>
        <button class="attachment-remove" onclick="removeAtt('${a.id}',${idx})">&times;</button>
      </div>`;
    }).join('');
  }catch(e){el.innerHTML='<span class="text-xs text-gray-400">Error loading</span>';}
}

async function removeAtt(id,idx){
  if(!confirm('Remove this attachment?'))return;
  await ATT.del(id);
  const exp=S.editingExpenses[idx];if(exp)loadAttList(idx,exp.transactionId);
}

let _previewState={items:[],idx:0,pdfDoc:null,pdfPage:1,pdfTotal:0};
async function previewAtt(id){
  const a=await ATT.getById(id);if(!a)return;
  // Gather all attachments for same transaction to allow prev/next
  const allAtts=await ATT.getByTxn(a.txnId);
  _previewState={items:allAtts,idx:allAtts.findIndex(x=>x.id===id)||0,pdfDoc:null,pdfPage:1,pdfTotal:0};
  renderPreview();
}
function closePreview(){
  _previewState={items:[],idx:0,pdfDoc:null,pdfPage:1,pdfTotal:0};
  const o=document.getElementById('previewOverlay');if(o)o.remove();
}
function previewNav(dir){
  _previewState.idx+=dir;_previewState.pdfDoc=null;_previewState.pdfPage=1;_previewState.pdfTotal=0;
  renderPreview();
}
async function renderPreview(){
  const ps=_previewState;if(!ps.items.length)return;
  const a=ps.items[ps.idx];if(!a)return;
  let old=document.getElementById('previewOverlay');if(old)old.remove();
  const overlay=document.createElement('div');overlay.id='previewOverlay';overlay.className='preview-overlay';
  overlay.onclick=e=>{if(e.target===overlay)closePreview();};
  const box=document.createElement('div');box.className='preview-box';
  // Header
  const hdr=document.createElement('div');hdr.className='preview-header';
  hdr.innerHTML=`<h4 title="${esc(a.name)}">${esc(a.name)}</h4><button class="btn btn-ghost btn-sm" onclick="closePreview()" style="flex-shrink:0"><svg class="icon"><use href="#ico-x"/></svg></button>`;
  box.appendChild(hdr);
  // Body
  const body=document.createElement('div');body.className='preview-body';body.id='previewBody';
  // Prev/Next arrows for multiple attachments
  if(ps.items.length>1){
    if(ps.idx>0){const pb=document.createElement('button');pb.className='preview-nav prev';pb.innerHTML='&#8249;';pb.onclick=()=>previewNav(-1);body.appendChild(pb);}
    if(ps.idx<ps.items.length-1){const nb=document.createElement('button');nb.className='preview-nav next';nb.innerHTML='&#8250;';nb.onclick=()=>previewNav(1);body.appendChild(nb);}
  }
  box.appendChild(body);
  // Footer
  const ftr=document.createElement('div');ftr.className='preview-footer';ftr.id='previewFooter';
  const sizeKB=a.size?(Math.round(a.size/1024)+'KB'):'';
  ftr.innerHTML=`<span>${ps.idx+1} / ${ps.items.length} &nbsp;·&nbsp; ${sizeKB}</span><div id="pdfPageNav"></div>`;
  box.appendChild(ftr);
  overlay.appendChild(box);document.body.appendChild(overlay);
  // Render content
  if(a.type.startsWith('image/')){
    const img=document.createElement('img');img.src=a.data;img.alt=a.name;body.appendChild(img);
  }else if(a.type==='application/pdf'){
    await renderPdfPreview(a,body);
  }
  // Keyboard navigation
  overlay.tabIndex=0;overlay.focus();
  overlay.onkeydown=e=>{
    if(e.key==='Escape')closePreview();
    else if(e.key==='ArrowLeft'){if(ps.idx>0)previewNav(-1);}
    else if(e.key==='ArrowRight'){if(ps.idx<ps.items.length-1)previewNav(1);}
    else if(e.key==='ArrowUp'&&ps.pdfDoc){e.preventDefault();pdfPageNav(-1);}
    else if(e.key==='ArrowDown'&&ps.pdfDoc){e.preventDefault();pdfPageNav(1);}
  };
}
async function renderPdfPreview(att,container){
  if(typeof pdfjsLib==='undefined'){container.innerHTML='<span class="text-gray-500">PDF.js not loaded</span>';return;}
  try{
    const b64=att.data.split(',')[1];
    const raw=atob(b64);const arr=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)arr[i]=raw.charCodeAt(i);
    const pdf=await pdfjsLib.getDocument({data:arr}).promise;
    _previewState.pdfDoc=pdf;_previewState.pdfTotal=pdf.numPages;_previewState.pdfPage=1;
    renderPdfPage(pdf,1,container);
    updatePdfNav();
  }catch(e){container.innerHTML='<span class="text-red-500">Error loading PDF: '+esc(e.message)+'</span>';}
}
async function renderPdfPage(pdf,pageNum,container){
  if(!container)container=document.getElementById('previewBody');
  // Remove old canvas
  const oldC=container.querySelector('canvas');if(oldC)oldC.remove();
  const page=await pdf.getPage(pageNum);
  const vp=page.getViewport({scale:1});
  // Scale to fit container
  const cw=container.clientWidth-40;const ch=container.clientHeight-20;
  const scale=Math.min(cw/vp.width,ch/vp.height,2);
  const viewport=page.getViewport({scale});
  const canvas=document.createElement('canvas');canvas.width=viewport.width;canvas.height=viewport.height;
  canvas.style.borderRadius='4px';canvas.style.boxShadow='0 2px 12px rgba(0,0,0,.12)';
  const ctx=canvas.getContext('2d');
  await page.render({canvasContext:ctx,viewport}).promise;
  container.appendChild(canvas);
}
function pdfPageNav(dir){
  const ps=_previewState;if(!ps.pdfDoc)return;
  const next=ps.pdfPage+dir;if(next<1||next>ps.pdfTotal)return;
  ps.pdfPage=next;
  renderPdfPage(ps.pdfDoc,ps.pdfPage);
  updatePdfNav();
}
function updatePdfNav(){
  const ps=_previewState;const el=document.getElementById('pdfPageNav');if(!el)return;
  if(ps.pdfTotal<=1){el.innerHTML='';return;}
  el.innerHTML=`<div class="pdf-page-nav">
    <button onclick="pdfPageNav(-1)" ${ps.pdfPage<=1?'disabled':''}>&#8249; Prev</button>
    <span>Page ${ps.pdfPage} / ${ps.pdfTotal}</span>
    <button onclick="pdfPageNav(1)" ${ps.pdfPage>=ps.pdfTotal?'disabled':''}>Next &#8250;</button>
  </div>`;
}
function cancelForm(){S.editingExpenses=[];S.editMeta=null;setState({screen:S.currentReport?'reportView':'transactions'});}

function saveReport(){
  const periodFromRaw=document.getElementById('periodFrom').value;
  const periodToRaw=document.getElementById('periodTo').value;
  const periodFrom=displayToIso(periodFromRaw);
  const periodTo=displayToIso(periodToRaw);
  const reason=document.getElementById('reason').value.trim();
  const errs=[];
  if(!periodFromRaw)errs.push('Period From is required');
  else if(!/^\d{2}\/\d{2}\/\d{4}$/.test(periodFromRaw))errs.push('Period From must be dd/mm/yyyy');
  if(!periodToRaw)errs.push('Period Until is required');
  else if(!/^\d{2}\/\d{2}\/\d{4}$/.test(periodToRaw))errs.push('Period Until must be dd/mm/yyyy');
  if(!reason)errs.push('Reason is required');
  S.editingExpenses.forEach((e,i)=>{const n=i+1;
    if(!e.category)errs.push(`Expense #${n}: Category required`);
    if(!e.invoiceType)errs.push(`Expense #${n}: Invoice/Receipt type required`);
    if(!e.description.trim())errs.push(`Expense #${n}: Description required`);
    if(NEEDS_CAR_PLATE.includes(e.category)&&!e.carPlate.trim())errs.push(`Expense #${n}: Car plate required`);
    if(e.category==='Third Party Payments'){if(!(e.caseName||'').trim())errs.push(`Expense #${n}: Case required`);if(!(e.clientName||'').trim())errs.push(`Expense #${n}: Client required`);}
  });
  if(errs.length){document.getElementById('formErrors').innerHTML=`<div class="error-box mb-6"><h3>Please fix:</h3><ul>${errs.map(e=>`<li>\u2022 ${esc(e)}</li>`).join('')}</ul></div>`;window.scrollTo({top:0,behavior:'smooth'});return;}

  // Strip internal flags before saving
  S.editingExpenses.forEach(e=>{delete e._autoSuggested;delete e._ocrProcessing;delete e._ocrDone;});
  const meta=S.editMeta;const total=S.editingExpenses.reduce((s,e)=>s+e.amount,0);
  const allReports=DB.getReports();const isEdit=!!S.currentReport;let report;
  if(isEdit){
    report={...S.currentReport,periodFrom,periodTo,reason,expenses:S.editingExpenses,total,updatedAt:new Date().toISOString(),reportType:meta.reportType||S.currentReport.reportType,autoDraft:false};
    const idx=allReports.findIndex(r=>r.id===report.id);if(idx>=0)allReports[idx]=report;
    const txns=DB.getTxns();S.editingExpenses.forEach(e=>{const t=txns.find(tx=>tx.id===e.transactionId);if(t)t.reportId=report.id;});DB.saveTxns(txns);
  } else {
    const rType=meta.reportType||'expense';
    const rNum=rType==='thirdparty'?DB.nextCounterTP():DB.nextCounter();
    report={id:uid(),reportNumber:rNum,reportType:rType,memberId:meta.memberId,memberName:meta.memberName,periodFrom,periodTo,reason,expenses:S.editingExpenses,total,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};
    allReports.push(report);
    const txns=DB.getTxns();S.editingExpenses.forEach(e=>{const t=txns.find(tx=>tx.id===e.transactionId);if(t)t.reportId=report.id;});DB.saveTxns(txns);
  }
  DB.saveReports(allReports);
  // Learn category rules from saved expenses
  report.expenses.forEach(e=>{if(e.merchant&&e.category&&e.category!=='Third Party Payments')saveCatRule(e.merchant,e.category);});
  S.editingExpenses=[];S.editMeta=null;S.selectedTxns=new Set();
  setState({screen:'reportView',currentReport:report});
}

function doAddMember(){
  const name=document.getElementById('mmName').value.trim();const dept=document.getElementById('mmDept').value;
  if(!name){document.getElementById('mmError').innerHTML='<p class="text-sm mt-2" style="color:var(--red-600)">Name is required</p>';return;}
  const members=DB.getMembers();members.push({id:'mem_'+uid(),name,department:dept,cardNumbers:[]});DB.saveMembers(members);setModal(null);
}
function doEditMember(id){
  const name=document.getElementById('mmName').value.trim();const dept=document.getElementById('mmDept').value;
  if(!name){document.getElementById('mmError').innerHTML='<p class="text-sm mt-2" style="color:var(--red-600)">Name is required</p>';return;}
  const members=DB.getMembers();const m=members.find(x=>x.id===id);if(m){m.name=name;m.department=dept;DB.saveMembers(members);}setModal(null);
}
function doAddCategory(){
  const name=document.getElementById('catName').value.trim();
  const hint=document.getElementById('catHint').value.trim();
  const needsPlate=document.getElementById('catPlate').checked;
  if(!name){document.getElementById('mmError').innerHTML='<p class="text-sm mt-2" style="color:var(--red-600)">Name is required</p>';return;}
  const cats=getCategories();if(cats.includes(name)){document.getElementById('mmError').innerHTML='<p class="text-sm mt-2" style="color:var(--red-600)">Category already exists</p>';return;}
  cats.push(name);saveCategories(cats);
  if(hint)CATEGORY_HINTS[name]=hint;
  if(needsPlate&&!NEEDS_CAR_PLATE.includes(name))NEEDS_CAR_PLATE.push(name);
  setModal(null);
}
function doEditCategory(oldName){
  const name=document.getElementById('catName').value.trim();
  const hint=document.getElementById('catHint').value.trim();
  const needsPlate=document.getElementById('catPlate').checked;
  if(!name){document.getElementById('mmError').innerHTML='<p class="text-sm mt-2" style="color:var(--red-600)">Name is required</p>';return;}
  const cats=getCategories();
  if(name!==oldName&&cats.includes(name)){document.getElementById('mmError').innerHTML='<p class="text-sm mt-2" style="color:var(--red-600)">Category already exists</p>';return;}
  const idx=cats.indexOf(oldName);if(idx>=0)cats[idx]=name;else cats.push(name);
  saveCategories(cats);
  if(oldName!==name){delete CATEGORY_HINTS[oldName];const pi=NEEDS_CAR_PLATE.indexOf(oldName);if(pi>=0)NEEDS_CAR_PLATE.splice(pi,1);}
  if(hint)CATEGORY_HINTS[name]=hint;else delete CATEGORY_HINTS[name];
  if(needsPlate){if(!NEEDS_CAR_PLATE.includes(name))NEEDS_CAR_PLATE.push(name);}else{const pi=NEEDS_CAR_PLATE.indexOf(name);if(pi>=0)NEEDS_CAR_PLATE.splice(pi,1);}
  setModal(null);
}

function doAddDept(){
  const name=document.getElementById('deptName').value.trim();if(!name)return;
  const depts=DB.getDepts();depts.push({id:'dept_'+uid(),name});DB.saveDepts(depts);setModal(null);
}

async function exportReportPDF(report){
  try{
    if(!window.jspdf){alert('PDF library not loaded. Check internet connection and reload.');return;}
    const{jsPDF}=window.jspdf;const doc=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
    setupPDFFont(doc);buildReportPage(doc,report);
    await addAttachmentPages(doc,report);
    const pfx=report.reportType==='thirdparty'?'ThirdParty':'Expenses';
    downloadPDF(doc,`${pfx}_${(report.memberName||'').replace(/\s+/g,'_')}_${reportLabel(report).replace('#','')}.pdf`);
  }catch(e){alert('PDF Error: '+e.message);console.error('PDF Export Error:',e);}
}

function buildReportPage(doc,report){
  const depts=DB.getDepts();const deptMap={};depts.forEach(d=>{deptMap[d.id]=d.name;});
  const pw=doc.internal.pageSize.getWidth(),ph=doc.internal.pageSize.getHeight(),m=14;
  const isTP=report.reportType==='thirdparty';
  if(isTP){doc.setFillColor(180,83,9);}else{doc.setFillColor(37,99,235);}
  doc.rect(0,0,pw,22,'F');
  const pdfTitle=isTP?'ΠΛΗΡΩΜΕΣ ΓΙΑ ΤΡΙΤΟΥΣ / THIRD PARTY PAYMENTS':'AT HOME EXPENSE SHEET';
  doc.setTextColor(255);doc.setFontSize(16);doc.setFont('DejaVuSans','bold');doc.text(pdfTitle,m,14);
  doc.setFontSize(10);doc.setFont('DejaVuSans','normal');doc.text(reportLabel(report),pw-m,14,{align:'right'});
  let y=30;
  if(isTP){doc.setFillColor(255,251,235);doc.setDrawColor(253,230,138);doc.roundedRect(m,y-4,pw-2*m,14,2,2,'FD');doc.setTextColor(146,64,14);doc.setFontSize(8);doc.setFont('DejaVuSans','bold');doc.text('\u26A0 Οι παρακάτω πληρωμές αφορούν τρίτους και ΔΕΝ αποτελούν έξοδα της εταιρείας.',m+4,y+3);doc.setFont('DejaVuSans','normal');y+=16;}
  doc.setTextColor(80);doc.setFontSize(9);
  doc.setFont('DejaVuSans','bold');doc.text('Member:',m,y);doc.setFont('DejaVuSans','normal');doc.text(report.memberName||'',m+22,y);
  doc.setFont('DejaVuSans','bold');doc.text('Period:',pw/2+10,y);doc.setFont('DejaVuSans','normal');doc.text(`${fmtDate(report.periodFrom)} - ${fmtDate(report.periodTo)}`,pw/2+24,y);
  y+=7;
  const reasonText=(report.reason||'').replace(/\n/g,' ');
  doc.setFont('DejaVuSans','bold');doc.text('Reason:',m,y);doc.setFont('DejaVuSans','normal');
  const reasonLines=doc.splitTextToSize(reasonText,pw-2*m-22);
  doc.text(reasonLines,m+22,y);
  y+=Math.max(6,reasonLines.length*4+2);
  doc.setDrawColor(200);doc.setLineWidth(.3);doc.line(m,y,pw-m,y);y+=4;
  const hasVAT=report.expenses.some(e=>e.vatLines&&e.vatLines.length);
  const hdr=hasVAT?[['#','Date','Merchant','Category','Doc','Description','Notes','VAT Breakdown','Total']]:[['#','Date','Merchant','Category','Doc','Description','Notes','Amount']];
  const rows=report.expenses.map((e,i)=>{
    let d=e.description||'';
    const meta=[];
    if(e.invoiceNumber&&e.invoiceNumber!=='-')meta.push('Inv: '+e.invoiceNumber);
    if(e.carPlate&&e.carPlate!=='-')meta.push('Plate: '+e.carPlate);
    if(e.chargeToDept&&deptMap[e.chargeToDept])meta.push('Dept: '+deptMap[e.chargeToDept]);
    if(e.category==='Third Party Payments'){if(e.caseName)meta.push('Case: '+e.caseName);if(e.clientName)meta.push('Client: '+e.clientName);}
    if(meta.length)d+=' ['+meta.join(' | ')+']';
    if(hasVAT){
      const vl=e.vatLines||[];
      const vatStr=vl.length?vl.map(v=>(v.rate!=null?v.rate+'%':'?')+': \u20ac'+(v.net||0).toFixed(2)+' + \u20ac'+(v.vat||0).toFixed(2)).join('\n'):'';
      return[(i+1).toString(),fmtDate(e.date),e.merchant||'',e.category,e.invoiceType,d,e.notes||'',vatStr,'\u20ac'+e.amount.toFixed(2)];
    }
    return[(i+1).toString(),fmtDate(e.date),e.merchant||'',e.category,e.invoiceType,d,e.notes||'','\u20ac'+e.amount.toFixed(2)];});
  const tblHead=isTP?[180,83,9]:[37,99,235];
  const colStyles=hasVAT?{0:{cellWidth:8,halign:'center'},1:{cellWidth:22},2:{cellWidth:34},3:{cellWidth:28},4:{cellWidth:13},5:{cellWidth:'auto'},6:{cellWidth:30,fontStyle:'italic',fontSize:7},7:{cellWidth:42,fontSize:7},8:{cellWidth:22,halign:'right',fontStyle:'bold'}}:{0:{cellWidth:8,halign:'center'},1:{cellWidth:22},2:{cellWidth:38},3:{cellWidth:34},4:{cellWidth:14},5:{cellWidth:'auto'},6:{cellWidth:40,fontStyle:'italic',fontSize:7},7:{cellWidth:22,halign:'right',fontStyle:'bold'}};
  doc.autoTable({head:hdr,body:rows,startY:y,margin:{left:m,right:m},theme:'grid',

    headStyles:{fillColor:tblHead,textColor:255,fontSize:8,fontStyle:'bold',halign:'left'},

    columnStyles:colStyles,
    didDrawPage:function(data){doc.setFontSize(7);doc.setTextColor(150);doc.text('Page '+data.pageNumber,pw-m,ph-6,{align:'right'});doc.text(isTP?'Third Party Payments — Not Company Expenses':'At Home Expense Tracker',m,ph-6);}});
  const fy=(doc.lastAutoTable?doc.lastAutoTable.finalY:y)+2;
  if(isTP){doc.setFillColor(180,83,9);}else{doc.setFillColor(37,99,235);}
  doc.rect(pw-m-60,fy,60,12,'F');
  doc.setTextColor(255);doc.setFontSize(11);doc.setFont('DejaVuSans','bold');
  doc.text('TOTAL:',pw-m-55,fy+8);doc.text('\u20ac'+report.total.toFixed(2),pw-m-3,fy+8,{align:'right'});
  if(isTP){const fy2=fy+16;doc.setFontSize(7);doc.setTextColor(146,64,14);doc.setFont('DejaVuSans','bold');doc.text('* Οι ανωτέρω πληρωμές αφορούν τρίτους και δεν αποτελούν έξοδα της εταιρείας.',m,fy2);}
}

async function renderPDFtoImage(b64data){
  if(!window.pdfjsLib)throw new Error('pdf.js not loaded');
  const raw=atob(b64data.split(',')[1]);const arr=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)arr[i]=raw.charCodeAt(i);
  const pdf=await pdfjsLib.getDocument({data:arr}).promise;
  const pages=[];
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p);const vp=page.getViewport({scale:2});
    const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;
    await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
    pages.push({data:c.toDataURL('image/jpeg',0.85),w:vp.width,h:vp.height});
  }
  return pages;
}

async function addAttachmentPages(doc,report){
  if(!ATT._ready)return;
  const pw=doc.internal.pageSize.getWidth(),ph=doc.internal.pageSize.getHeight(),m=14;
  const isTP=report.reportType==='thirdparty';
  let hasAny=false;
  for(let i=0;i<report.expenses.length;i++){
    const exp=report.expenses[i];
    let atts=[];try{atts=await ATT.getByTxn(exp.transactionId);}catch(e){continue;}
    if(!atts.length)continue;
    for(const att of atts){
      doc.addPage();hasAny=true;
      // Header bar
      if(isTP){doc.setFillColor(180,83,9);}else{doc.setFillColor(37,99,235);}
      doc.rect(0,0,pw,16,'F');
      doc.setTextColor(255);doc.setFontSize(9);doc.setFont('DejaVuSans','bold');
      doc.text('Attachment: '+att.name,m,11);
      doc.setFont('DejaVuSans','normal');doc.setFontSize(8);
      doc.text('#'+(i+1)+' '+exp.merchant+' | '+fmtDate(exp.date)+' | \u20ac'+exp.amount.toFixed(2),pw-m,11,{align:'right'});
      const contentY=22,contentH=ph-28,contentW=pw-2*m;
      try{
        if(att.type.startsWith('image/')){
          // Embed image directly, fit to page
          const img=await loadImageDims(att.data);
          const ratio=Math.min(contentW/img.w,contentH/img.h);
          const iw=img.w*ratio,ih=img.h*ratio;
          const ix=m+(contentW-iw)/2,iy=contentY+(contentH-ih)/2;
          doc.addImage(att.data,att.type==='image/png'?'PNG':'JPEG',ix,iy,iw,ih);
        }else if(att.type==='application/pdf'){
          const pages=await renderPDFtoImage(att.data);
          for(let p=0;p<pages.length;p++){
            if(p>0){doc.addPage();
              if(isTP){doc.setFillColor(180,83,9);}else{doc.setFillColor(37,99,235);}
              doc.rect(0,0,pw,16,'F');doc.setTextColor(255);doc.setFontSize(9);doc.setFont('DejaVuSans','bold');
              doc.text('Attachment: '+att.name+' (p.'+(p+1)+')',m,11);
              doc.setFont('DejaVuSans','normal');doc.setFontSize(8);
              doc.text('#'+(i+1)+' '+exp.merchant,pw-m,11,{align:'right'});
            }
            const pg=pages[p];const ratio=Math.min(contentW/pg.w,contentH/pg.h);
            const iw=pg.w*ratio,ih=pg.h*ratio;
            const ix=m+(contentW-iw)/2,iy=contentY+(contentH-ih)/2;
            doc.addImage(pg.data,'JPEG',ix,iy,iw,ih);
          }
        }
      }catch(e){
        doc.setTextColor(200,0,0);doc.setFontSize(10);doc.setFont('DejaVuSans','normal');
        doc.text('Could not embed: '+att.name,m,contentY+20);
        console.error('Attachment embed error:',e);
      }
      // Footer
      doc.setFontSize(7);doc.setTextColor(150);doc.text(reportLabel(report)+' | '+att.name,m,ph-6);
    }
  }
}

function loadImageDims(b64){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>res({w:img.width,h:img.height});img.onerror=rej;img.src=b64;});}

function downloadPDF(doc,filename){
  const blob=doc.output('blob');const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=filename;
  document.body.appendChild(a);a.click();
  setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},100);
}

// ═══════════════════════════════════════════════════════════════
// POST-RENDER
// ═══════════════════════════════════════════════════════════════
function setupPostRender(){
  const fileInput=document.getElementById('csvFile');
  if(fileInput)fileInput.onchange=e=>{if(e.target.files.length)handleImportFile(e.target.files[0]);};
  const zone=document.getElementById('uploadZone');
  if(zone){
    zone.onclick=()=>{const f=document.getElementById('csvFile');if(f)f.click();};
    zone.ondragover=e=>{e.preventDefault();zone.classList.add('dragover');};
    zone.ondragleave=()=>{zone.classList.remove('dragover');};
    zone.ondrop=e=>{e.preventDefault();zone.classList.remove('dragover');if(e.dataTransfer.files.length)handleImportFile(e.dataTransfer.files[0]);};
  }
  if(S.screen==='reportForm')renderExpCards();
  if(S.screen==='transactions'&&ATT._ready)loadAttFlags();
  if(S.screen==='review'&&ATT._ready)reviewLoadAttFlags();
}
async function loadAttFlags(){
  const txns=DB.getTxns();
  for(const t of txns){
    const el=document.getElementById('att_'+t.id);if(!el)continue;
    try{
      const items=await ATT.getByTxn(t.id);
      if(items.length){el.innerHTML='<svg style="width:14px;height:14px;color:var(--blue-500)" title="'+items.length+' attachment'+(items.length>1?'s':'')+'"><use href="#ico-paperclip"/></svg>';}
    }catch(e){}
  }
}

render();
