<style>
  :root {
    --blue-50:#eff6ff;--blue-100:#dbeafe;--blue-200:#bfdbfe;--blue-500:#3b82f6;
    --blue-600:#2563eb;--blue-700:#1d4ed8;--blue-800:#1e40af;
    --indigo-600:#4f46e5;
    --emerald-50:#ecfdf5;--emerald-100:#d1fae5;--emerald-600:#059669;--emerald-700:#047857;--emerald-800:#065f46;
    --amber-50:#fffbeb;--amber-100:#fef3c7;--amber-200:#fde68a;--amber-600:#d97706;--amber-700:#b45309;--amber-800:#92400e;
    --red-50:#fef2f2;--red-100:#fee2e2;--red-200:#fecaca;--red-500:#ef4444;--red-600:#dc2626;--red-700:#b91c1c;--red-800:#991b1b;
    --purple-50:#faf5ff;--purple-100:#f3e8ff;--purple-600:#9333ea;--purple-700:#7e22ce;--purple-800:#6b21a8;
    --gray-50:#f9fafb;--gray-100:#f3f4f6;--gray-200:#e5e7eb;--gray-300:#d1d5db;
    --gray-400:#9ca3af;--gray-500:#6b7280;--gray-600:#4b5563;--gray-700:#374151;
    --gray-800:#1f2937;--gray-900:#111827;
    --radius:12px;--radius-sm:8px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:var(--gray-50);color:var(--gray-900);line-height:1.5;min-height:100vh;}
  .container{max-width:1200px;margin:0 auto;padding:0 24px;}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}
  .hidden{display:none!important;}
  .flex{display:flex;}.flex-col{flex-direction:column;}.items-center{align-items:center;}
  .justify-between{justify-content:space-between;}.justify-center{justify-content:center;}
  .flex-wrap{flex-wrap:wrap;}
  .gap-2{gap:8px;}.gap-3{gap:12px;}.gap-4{gap:16px;}
  .grid{display:grid;}.grid-2{grid-template-columns:repeat(2,1fr);}.grid-3{grid-template-columns:repeat(3,1fr);}.grid-4{grid-template-columns:repeat(4,1fr);}
  .col-span-2{grid-column:span 2;}
  .text-center{text-align:center;}.text-right{text-align:right;}
  .text-xs{font-size:12px;}.text-sm{font-size:14px;}.text-base{font-size:16px;}.text-lg{font-size:18px;}.text-xl{font-size:20px;}.text-2xl{font-size:24px;}.text-3xl{font-size:30px;}
  .font-medium{font-weight:500;}.font-semibold{font-weight:600;}.font-bold{font-weight:700;}
  .text-white{color:#fff;}.text-gray-400{color:var(--gray-400);}.text-gray-500{color:var(--gray-500);}.text-gray-600{color:var(--gray-600);}.text-gray-700{color:var(--gray-700);}.text-gray-900{color:var(--gray-900);}
  .mt-1{margin-top:4px;}.mt-2{margin-top:8px;}.mt-4{margin-top:16px;}.mb-1{margin-bottom:4px;}.mb-2{margin-bottom:8px;}.mb-4{margin-bottom:16px;}.mb-6{margin-bottom:24px;}.mb-8{margin-bottom:32px;}
  .p-4{padding:16px;}.p-5{padding:20px;}.p-6{padding:24px;}.p-8{padding:32px;}
  .px-3{padding-left:12px;padding-right:12px;}.px-4{padding-left:16px;padding-right:16px;}
  .py-2{padding-top:8px;padding-bottom:8px;}.py-3{padding-top:12px;padding-bottom:12px;}
  .w-full{width:100%;}
  .truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .whitespace-nowrap{white-space:nowrap;}
  .overflow-x-auto{overflow-x:auto;}
  .space-y-3>*+*{margin-top:12px;}.space-y-4>*+*{margin-top:16px;}
  .uppercase{text-transform:uppercase;}.tracking-wide{letter-spacing:.05em;}
  .card{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius);}
  .card-shadow{box-shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);}
  input[type="text"],input[type="number"],input[type="date"],input[type="password"],input[type="email"],select,textarea{
    width:100%;padding:8px 12px;border:1px solid var(--gray-300);border-radius:var(--radius-sm);
    font-size:14px;font-family:inherit;background:#fff;color:var(--gray-900);outline:none;transition:border-color .15s,box-shadow .15s;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--blue-500);box-shadow:0 0 0 3px rgba(59,130,246,.15);}
  textarea{resize:vertical;min-height:60px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:500;border-radius:var(--radius-sm);border:none;cursor:pointer;transition:all .15s;font-family:inherit;text-decoration:none;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn-sm{padding:6px 12px;font-size:12px;}.btn-md{padding:8px 16px;font-size:14px;}.btn-lg{padding:12px 24px;font-size:16px;}
  .btn-primary{background:var(--blue-600);color:#fff;}.btn-primary:hover:not(:disabled){background:var(--blue-700);}
  .btn-secondary{background:#fff;color:var(--gray-700);border:1px solid var(--gray-300);}.btn-secondary:hover:not(:disabled){background:var(--gray-50);}
  .btn-danger{background:var(--red-600);color:#fff;}.btn-danger:hover:not(:disabled){background:var(--red-700);}
  .btn-success{background:var(--emerald-600);color:#fff;}.btn-success:hover:not(:disabled){background:var(--emerald-700);}
  .btn-ghost{background:transparent;color:var(--gray-600);}.btn-ghost:hover{background:var(--gray-100);}
  .badge{display:inline-flex;align-items:center;padding:2px 10px;border-radius:999px;font-size:11px;font-weight:600;}
  .badge-blue{background:var(--blue-100);color:var(--blue-800);}
  .badge-green{background:var(--emerald-100);color:var(--emerald-800);}
  .badge-red{background:var(--red-100);color:var(--red-800);}
  .badge-amber{background:var(--amber-100);color:var(--amber-800);}
  .badge-purple{background:var(--purple-100);color:var(--purple-800);}
  .badge-gray{background:var(--gray-100);color:var(--gray-600);}
  .hint-box{background:var(--amber-50);border:1px solid var(--amber-200);border-radius:var(--radius-sm);padding:8px 12px;font-size:12px;color:var(--amber-800);}
  .error-box{background:var(--red-50);border:1px solid var(--red-200);border-radius:var(--radius);padding:16px;}
  .error-box h3{font-size:14px;font-weight:600;color:var(--red-800);margin-bottom:8px;}
  .error-box li{font-size:12px;color:var(--red-700);margin-bottom:4px;list-style:none;}
  .success-box{background:var(--emerald-50);border:1px solid var(--emerald-100);border-radius:var(--radius);padding:16px;color:var(--emerald-800);font-size:14px;}
  .total-bar{background:linear-gradient(135deg,var(--blue-600),var(--indigo-600));border-radius:var(--radius);padding:20px 24px;color:#fff;display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 14px rgba(37,99,235,.3);}
  .app-header{background:#fff;border-bottom:1px solid var(--gray-200);padding:12px 0;position:sticky;top:0;z-index:50;}
  .app-header .inner{display:flex;align-items:center;justify-content:space-between;}
  .logo{display:flex;align-items:center;gap:10px;cursor:pointer;}
  .logo-icon{width:32px;height:32px;background:var(--blue-600);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;}
  .logo span{font-weight:700;font-size:14px;color:var(--gray-900);}
  .data-table{width:100%;border-collapse:collapse;font-size:14px;}
  .data-table thead th{background:var(--gray-50);border-bottom:1px solid var(--gray-200);padding:10px 16px;font-size:11px;font-weight:600;color:var(--gray-500);text-transform:uppercase;text-align:left;white-space:nowrap;}
  .data-table tbody td{padding:10px 16px;border-bottom:1px solid var(--gray-100);}
  .data-table tbody tr:hover{background:var(--gray-50);}
  .data-table tfoot td{padding:12px 16px;background:var(--gray-50);border-top:2px solid var(--gray-200);font-weight:700;}
  .report-card{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius);padding:20px;cursor:pointer;transition:all .15s;}
  .report-card:hover{box-shadow:0 4px 12px rgba(0,0,0,.06);border-color:var(--blue-200);}
  .report-card .num{width:42px;height:42px;background:var(--blue-100);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;color:var(--blue-700);font-weight:700;font-size:14px;flex-shrink:0;}
  .report-card:hover .num{background:var(--blue-600);color:#fff;}
  .expense-card{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius);padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
  .expense-card .top-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .expense-card .fields{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  .field label{display:block;font-size:11px;font-weight:500;color:var(--gray-500);margin-bottom:4px;text-transform:uppercase;letter-spacing:.03em;}
  .field-static{padding:8px 12px;background:var(--gray-50);border:1px solid var(--gray-200);border-radius:var(--radius-sm);font-size:14px;color:var(--gray-700);}
  .stat-card{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius);padding:20px;}
  .stat-card .label{font-size:12px;font-weight:500;color:var(--gray-500);margin-bottom:4px;}
  .stat-card .value{font-size:24px;font-weight:700;color:var(--gray-900);}
  .stat-accent{background:linear-gradient(135deg,var(--blue-600),var(--indigo-600));color:#fff;box-shadow:0 4px 14px rgba(37,99,235,.3);}
  .stat-accent .label{color:rgba(255,255,255,.7);}.stat-accent .value{color:#fff;}
  .empty-state{text-align:center;padding:64px 24px;background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius);}
  .empty-state svg{width:64px;height:64px;color:var(--gray-300);margin-bottom:16px;}
  .empty-state h3{font-size:18px;font-weight:600;margin-bottom:4px;}
  .empty-state p{font-size:14px;color:var(--gray-500);margin-bottom:16px;}
  .icon{width:20px;height:20px;flex-shrink:0;}.icon-sm{width:16px;height:16px;}
  .tabs{display:flex;gap:4px;border-bottom:2px solid var(--gray-200);margin-bottom:24px;}
  .tab{padding:10px 20px;font-size:14px;font-weight:500;color:var(--gray-500);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s;font-family:inherit;display:flex;align-items:center;gap:6px;}
  .tab:hover{color:var(--gray-700);}
  .tab.active{color:var(--blue-600);border-bottom-color:var(--blue-600);}
  .tab .count{background:var(--red-100);color:var(--red-700);padding:1px 8px;border-radius:999px;font-size:11px;font-weight:700;}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:100;padding:24px;}
  .modal{background:#fff;border-radius:var(--radius);box-shadow:0 20px 60px rgba(0,0,0,.15);width:100%;max-width:500px;max-height:90vh;overflow-y:auto;}
  .modal-header{padding:20px 24px;border-bottom:1px solid var(--gray-200);display:flex;align-items:center;justify-content:space-between;}
  .modal-body{padding:24px;}
  .modal-footer{padding:16px 24px;border-top:1px solid var(--gray-200);display:flex;justify-content:flex-end;gap:8px;}
  .month-pill{display:inline-flex;align-items:center;padding:6px 16px;border-radius:999px;font-size:13px;font-weight:500;cursor:pointer;border:1px solid var(--gray-300);background:#fff;color:var(--gray-600);transition:all .15s;}
  .month-pill:hover{border-color:var(--blue-400);color:var(--blue-600);}
  .month-pill.active{background:var(--blue-600);color:#fff;border-color:var(--blue-600);}
  .upload-zone{border:2px dashed var(--gray-300);border-radius:var(--radius);padding:48px 24px;text-align:center;cursor:pointer;transition:all .15s;background:#fff;}
  .upload-zone:hover,.upload-zone.dragover{border-color:var(--blue-500);background:var(--blue-50);}
  .nav-btn{padding:8px 16px;font-size:13px;font-weight:500;border:none;background:none;cursor:pointer;color:var(--gray-500);border-radius:var(--radius-sm);transition:all .15s;font-family:inherit;}
  .nav-btn:hover{background:var(--gray-100);color:var(--gray-700);}
  .nav-btn.active{background:var(--blue-600);color:#fff;}
  .nav-btn.active:hover{background:var(--blue-700);}
  input[type="checkbox"]{width:16px;height:16px;cursor:pointer;accent-color:var(--blue-600);}
  @media(max-width:768px){
    .grid-3,.grid-4{grid-template-columns:1fr 1fr;}
    .expense-card .fields{grid-template-columns:1fr 1fr;}
    .col-span-2{grid-column:span 1;}
    .report-card{flex-direction:column;gap:12px;align-items:flex-start;}
  }
  @media(max-width:480px){
    .grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}
    .expense-card .fields{grid-template-columns:1fr;}
    .total-bar{flex-direction:column;gap:8px;text-align:center;}
  }
  .attachments-section{padding-top:12px;border-top:1px solid var(--gray-200);margin-top:16px;}
  .attachment-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
  .attachment-item{position:relative;display:inline-flex;flex-direction:column;align-items:center;border:1px solid var(--gray-300);border-radius:var(--radius-sm);overflow:visible;background:var(--gray-50);width:90px;}
  .attachment-thumbnail{display:block;width:88px;height:72px;object-fit:cover;border-radius:var(--radius-sm) var(--radius-sm) 0 0;cursor:pointer;}
  .attachment-pdf-badge{display:flex;align-items:center;justify-content:center;width:88px;height:72px;background:var(--red-50);color:var(--red-600);font-weight:700;font-size:11px;cursor:pointer;border-radius:var(--radius-sm) var(--radius-sm) 0 0;}
  .attachment-name{font-size:9px;color:var(--gray-500);padding:2px 4px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:88px;}
  .attachment-remove{position:absolute;top:-6px;right:-6px;width:20px;height:20px;background:var(--red-600);color:#fff;border:2px solid #fff;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;line-height:1;opacity:0;transition:opacity .15s;}
  .attachment-item:hover .attachment-remove{opacity:1;}
  .preview-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px;animation:fadeIn .15s ease;}
  .preview-box{background:#fff;border-radius:var(--radius);width:95vw;max-width:900px;height:90vh;display:flex;flex-direction:column;box-shadow:0 24px 80px rgba(0,0,0,.3);}
  .preview-header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--gray-200);flex-shrink:0;}
  .preview-header h4{font-size:14px;font-weight:600;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .preview-body{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;background:var(--gray-100);position:relative;}
  .preview-body img{max-width:100%;max-height:100%;object-fit:contain;}
  .preview-body canvas{max-width:100%;max-height:100%;}
  .preview-nav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.9);border:1px solid var(--gray-300);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--gray-600);box-shadow:0 2px 8px rgba(0,0,0,.1);z-index:5;}
  .preview-nav:hover{background:#fff;color:var(--gray-900);}
  .preview-nav.prev{left:12px;}
  .preview-nav.next{right:12px;}
  .preview-footer{padding:8px 20px;border-top:1px solid var(--gray-200);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;font-size:12px;color:var(--gray-500);}
  .pdf-page-nav{display:flex;align-items:center;gap:8px;}
  .pdf-page-nav button{padding:4px 10px;border:1px solid var(--gray-300);border-radius:var(--radius-sm);background:#fff;cursor:pointer;font-size:12px;}
  .pdf-page-nav button:hover{background:var(--gray-100);}
  .pdf-page-nav button:disabled{opacity:.4;cursor:default;}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .ag-member-card{padding:14px 18px;border:1px solid var(--gray-200);border-radius:var(--radius);cursor:pointer;display:flex;align-items:center;justify-content:space-between;transition:all .15s;}
  .ag-member-card:hover{border-color:var(--blue-400);background:var(--blue-50);}
  .ag-member-card.selected{border-color:var(--blue-500);background:var(--blue-50);box-shadow:0 0 0 2px var(--blue-200);}
  .ag-txn-row{display:flex;align-items:center;gap:12px;padding:10px 14px;border:1px solid var(--gray-200);border-radius:var(--radius-sm);margin-bottom:6px;font-size:13px;transition:all .15s;}
  .ag-txn-row.excluded{opacity:.4;background:var(--gray-100);text-decoration:line-through;}
  .ag-txn-row .att-flag{display:inline-flex;align-items:center;gap:3px;font-size:11px;padding:2px 8px;border-radius:10px;}
  .ag-txn-row .att-flag.has{background:var(--green-50);color:var(--green-700);}
  .ag-txn-row .att-flag.missing{background:var(--red-50);color:var(--red-600);}
  .ag-step-bar{display:flex;align-items:center;gap:8px;margin-bottom:24px;}
  .ag-step{padding:6px 16px;border-radius:20px;font-size:12px;font-weight:600;}
  .ag-step.active{background:var(--blue-500);color:#fff;}
  .ag-step.done{background:var(--green-100);color:var(--green-700);}
  .ag-step.pending{background:var(--gray-100);color:var(--gray-400);}
  .txn-note-btn{background:none;border:none;cursor:pointer;padding:2px;border-radius:4px;display:inline-flex;align-items:center;gap:3px;font-size:10px;color:var(--gray-400);transition:all .15s;}
  .txn-note-btn:hover{color:var(--blue-500);background:var(--blue-50);}
  .txn-note-btn.has-note{color:var(--blue-500);}
  .note-popover{position:fixed;z-index:150;background:#fff;border:1px solid var(--gray-300);border-radius:var(--radius);box-shadow:0 8px 30px rgba(0,0,0,.15);padding:12px;width:280px;}
  .note-popover textarea{width:100%;font-size:12px;border:1px solid var(--gray-300);border-radius:var(--radius-sm);padding:8px;resize:vertical;min-height:60px;}
  .note-popover .note-actions{display:flex;justify-content:flex-end;gap:6px;margin-top:8px;}
  .review-member-section{margin-bottom:24px;border:1px solid var(--gray-200);border-radius:var(--radius);overflow:hidden;}
  .review-member-header{background:var(--gray-50);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--gray-200);cursor:pointer;}
  .review-member-header:hover{background:var(--gray-100);}
  .review-member-header h4{margin:0;font-size:14px;}
</style>
</head>

const DEFAULT_CATEGORIES=["Advertising","Air transportation","Cleaning / maintenance services","Coffee/Meals Personal","Consumables (ink, paper, etc.)","Electricity, water, natural gas","Fuel","Hospitality","Internet","Meals with partners","Office equipment (computers, printers, furniture)","Office supplies","Parking","Pharmacy","Sea transportation","Software / subscriptions","Telephone","Tolls","Transportation (public transport, taxi)","Vehicle maintenance / service","Vehicle rental","Third Party Payments"];
function getCategories(){const c=DB._get('athm_categories',null);return c||[...DEFAULT_CATEGORIES];}
function saveCategories(cats){DB._set('athm_categories',cats);}
const CATEGORY_HINTS={"Fuel":"Over 50\u20ac ask for invoice. If no invoice, receipt must be signed.","Hospitality":"Mention date of accommodation","Meals with partners":"Strictly name the partner","Parking":"State the plate of the car","Software / subscriptions":"State month/year of subscription","Vehicle maintenance / service":"State the plate of the car","Vehicle rental":"State the plate of the car","Third Party Payments":"MUST complete Case and Client fields."};
const NEEDS_CAR_PLATE=["Fuel","Parking","Vehicle maintenance / service","Vehicle rental","Tolls"];
// Auto-categorization: learn from past reports
function suggestCategory(merchant){
  if(!merchant)return'';
  const key=merchant.toLowerCase().trim();
  // 1. Check manual rules stored in localStorage
  const rules=DB._get('athm_cat_rules',{});
  if(rules[key])return rules[key];
  // 2. Partial match on rules
  for(const rKey in rules){if(key.includes(rKey)||rKey.includes(key))return rules[rKey];}
  // 3. Learn from existing categorized expenses in reports
  const reports=DB.getReports();const cats=getCategories();
  const freq={};
  reports.forEach(r=>{r.expenses.forEach(e=>{
    if(!e.category||!cats.includes(e.category))return;
    const mk=(e.merchant||'').toLowerCase().trim();if(!mk)return;
    if(mk===key||(mk.length>4&&key.includes(mk))||(key.length>4&&mk.includes(key))){
      freq[e.category]=(freq[e.category]||0)+1;
    }
  });});
  // Return the most frequent match
  let best='',bestN=0;
  for(const c in freq){if(freq[c]>bestN){bestN=freq[c];best=c;}}
  return best;
}
function saveCatRule(merchant,category){
  if(!merchant||!category)return;
  const rules=DB._get('athm_cat_rules',{});
  rules[merchant.toLowerCase().trim()]=category;
  DB._set('athm_cat_rules',rules);
}
const INVOICE_OPTIONS=["Invoice","Receipt","Missing"];

const ATT={
  _db:null,_ready:false,_queue:[],
  init(){return new Promise((res,rej)=>{const r=indexedDB.open('athm_attachments',1);r.onerror=()=>rej(r.error);r.onsuccess=()=>{ATT._db=r.result;ATT._ready=true;ATT._queue.forEach(fn=>fn());ATT._queue=[];res();};r.onupgradeneeded=e=>{const db=e.target.result;if(!db.objectStoreNames.contains('files')){const s=db.createObjectStore('files',{keyPath:'id'});s.createIndex('txnId','txnId',{unique:false});}};});},
  _tx(mode){return ATT._db.transaction('files',mode).objectStore('files');},
  save(att){return new Promise((res,rej)=>{const r=ATT._tx('readwrite').put(att);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);});},
  getByTxn(txnId){return new Promise((res,rej)=>{const r=ATT._tx('readonly').index('txnId').getAll(txnId);r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error);});},
  getById(id){return new Promise((res,rej)=>{const r=ATT._tx('readonly').get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});},
  del(id){return new Promise((res,rej)=>{const r=ATT._tx('readwrite').delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);});},
  async delByTxn(txnId){const items=await ATT.getByTxn(txnId);for(const it of items)await ATT.del(it.id);},
};
ATT.init().catch(e=>console.warn('IndexedDB:',e));

function uid(){return Date.now().toString(36)+Math.random().toString(36).substr(2,6);}
function fmtDate(d){if(!d)return'';const p=d.split('-');if(p.length===3)return`${p[2]}/${p[1]}/${p[0]}`;const dt=new Date(d);if(isNaN(dt))return d;return`${String(dt.getDate()).padStart(2,'0')}/${String(dt.getMonth()+1).padStart(2,'0')}/${dt.getFullYear()}`;}
function fmtMonth(d){const dt=new Date(d);const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return months[dt.getMonth()]+' '+dt.getFullYear();}
function getMonthKey(d){const dt=new Date(d);return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0');}
function reportTouchesMonth(r,monthKey){
  if(!r.expenses||!r.expenses.length)return r.periodFrom&&getMonthKey(r.periodFrom)===monthKey;
  return r.expenses.some(e=>e.date&&e.date.substring(0,7)===monthKey);
}
function reportMonthAmount(r,monthKey){
  // Return only the sum of expenses that belong to the given month
  if(!monthKey||!r.expenses||!r.expenses.length)return r.total;
  return r.expenses.filter(e=>e.date&&e.date.substring(0,7)===monthKey).reduce((s,e)=>s+e.amount,0);
}
function reportLabel(r){return r.reportType==='thirdparty'?'TP-'+r.reportNumber:'#'+r.reportNumber;}
function reportTitle(r){return r.reportType==='thirdparty'?'Third Party Payments':'Expense Report';}
function esc(s){if(!s)return'';const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function optHtml(opts,ph,sel){let h=`<option value="">${esc(ph)}</option>`;opts.forEach(o=>{h+=`<option value="${esc(o)}"${o===sel?' selected':''}>${esc(o)}</option>`;});return h;}
function isoToDisplay(d){if(!d)return'';const p=d.split('-');if(p.length===3)return p[2]+'/'+p[1]+'/'+p[0];return d;}
function displayToIso(d){if(!d)return'';const p=d.split('/');if(p.length===3)return p[2]+'-'+p[1]+'-'+p[0];return d;}
function autoSlashDate(el){let v=el.value.replace(/[^\d]/g,'');if(v.length>2)v=v.slice(0,2)+'/'+v.slice(2);if(v.length>5)v=v.slice(0,5)+'/'+v.slice(5);el.value=v.slice(0,10);}
function validateDateInput(el){const v=el.value;if(!v)return;const m=v.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);if(!m){el.style.borderColor='var(--red-500)';return;}const dt=new Date(m[3]+'-'+m[2]+'-'+m[1]);if(isNaN(dt)){el.style.borderColor='var(--red-500)';}else{el.style.borderColor='';}}
// Parse amount string: handles "1,234.56" (EN) and "1.234,56" (EU) and plain "1234.56"
function parseAmount(s){
  if(s==null)return 0;
  s=String(s).trim();if(!s)return 0;
  // Detect format: if both . and , exist, the last one is the decimal separator
  const lastDot=s.lastIndexOf('.');const lastComma=s.lastIndexOf(',');
  if(lastComma>lastDot){
    // European: 1.234,56 → remove dots, replace comma with dot
    s=s.replace(/\./g,'').replace(',','.');
  } else if(lastDot>lastComma){
    // English: 1,234.56 → just remove commas
    s=s.replace(/,/g,'');
  } else {
    // Only one or neither — remove commas just in case
    s=s.replace(/,/g,'');
  }
  const v=parseFloat(s);
  return isNaN(v)?0:v;
}

// CSV IMPORT
// ═══════════════════════════════════════════════════════════════
function triggerImport(){document.getElementById('csvFile').click();}
function importCSV(file){
  Papa.parse(file,{header:true,skipEmptyLines:true,
    complete:function(results){processCSVData(results.data);},
    error:function(err){alert('Error parsing CSV: '+err.message);}
  });
}
function processCSVData(rows){
  const existing=DB.getTxns();const existingIds=new Set(existing.map(t=>t.id));
  const existingMap={};existing.forEach(t=>{existingMap[t.id]=t;});
  const members=DB.getMembers();let newCount=0,newMembers=0,updatedCount=0;const newTxns=[];
  rows.forEach(row=>{
    const status=(row['Transaction status']||'').trim();
    if(status!=='COMPLETED')return;
    const txnId=(row['Transaction ID']||'').trim();
    if(!txnId)return;
    // Backfill expenseId on existing transactions that don't have it
    if(existingIds.has(txnId)){
      const expId=(row['Expense ID']||'').trim();
      const ex=existingMap[txnId];
      if(expId&&ex&&!ex.expenseId){ex.expenseId=expId;updatedCount++;}
      return;
    }
    const payer=(row['Payer']||'').trim();
    const card=(row['Card number']||'').trim();
    if(!payer)return;
    let member=null;
    if(card)member=members.find(m=>m.cardNumbers&&m.cardNumbers.includes(card));
    if(!member)member=members.find(m=>m.name.toLowerCase()===payer.toLowerCase());
    if(!member){member={id:'mem_'+uid(),name:payer,department:'',cardNumbers:card?[card]:[]};members.push(member);newMembers++;}
    else if(card&&(!member.cardNumbers||!member.cardNumbers.includes(card))){if(!member.cardNumbers)member.cardNumbers=[];member.cardNumbers.push(card);}
    newTxns.push({id:txnId,expenseId:(row['Expense ID']||'').trim(),date:(row['Transaction started (UTC)']||'').trim(),merchant:(row['Transaction description']||'').trim(),payer,memberId:member.id,cardNumber:card,amount:parseAmount(row['Orig amount (Orig currency)']),currency:(row['Orig currency']||'EUR').trim(),description:(row['Expense description']||'').trim(),receipts:parseInt(row['Receipts'])||0,taxName:(row['Tax name']||'').trim(),taxRate:(row['Tax rate']||'').trim(),taxAmount:parseAmount(row['Tax amount (Orig currency)']),revolCategory:(row['Expense category name']||'').trim(),reportId:null,importedAt:new Date().toISOString()});
    newCount++;
  });
  if(newTxns.length||updatedCount)DB.saveTxns([...existing,...newTxns]);
  DB.saveMembers(members);
  S.importMsg=`Imported ${newCount} transactions`+(updatedCount?`, ${updatedCount} updated`:'')+(newMembers?`, ${newMembers} new members detected`:'');
  S.selectedTxns=new Set();render();
  setTimeout(()=>{S.importMsg=null;const el=document.getElementById('importMsg');if(el)el.remove();},5000);
}

// ═══════════════════════════════════════════════════════════════
// ZIP IMPORT (Revolut export with receipts)
// ═══════════════════════════════════════════════════════════════
async function importZIP(file){
  if(typeof JSZip==='undefined'){alert('JSZip library not loaded. Please refresh and try again.');return;}
  try{
    S.importMsg='Processing ZIP file...';render();
    const zip=await JSZip.loadAsync(file);
    // Find the CSV file inside the ZIP
    let csvFile=null;
    const receiptFiles=[];
    zip.forEach((path,entry)=>{
      if(entry.dir)return;
      const name=path.split('/').pop().toLowerCase();
      if(name.endsWith('.csv'))csvFile=entry;
      else if(name.match(/^receipt_.*\.(jpeg|jpg|png|pdf)$/i))receiptFiles.push(entry);
    });
    if(!csvFile){alert('No CSV file found inside the ZIP.');S.importMsg=null;render();return;}
    // Parse the CSV
    const csvText=await csvFile.async('string');
    const parsed=Papa.parse(csvText,{header:true,skipEmptyLines:true});
    if(parsed.errors.length&&!parsed.data.length){alert('Error parsing CSV inside ZIP: '+parsed.errors[0].message);S.importMsg=null;render();return;}
    // Process CSV data (this stores transactions with expenseId)
    processCSVData(parsed.data);
    // Now auto-match receipts to transactions
    if(receiptFiles.length){
      await autoMatchReceipts(receiptFiles);
    }
  }catch(e){
    alert('Error processing ZIP: '+e.message);
    S.importMsg=null;render();
  }
}
async function autoMatchReceipts(receiptEntries){
  const txns=DB.getTxns();
  // Build a map: expenseId → transaction id
  const expIdToTxnId={};
  txns.forEach(t=>{if(t.expenseId)expIdToTxnId[t.expenseId]=t.id;});
  let matched=0,skipped=0;
  for(const entry of receiptEntries){
    const fname=entry.name.split('/').pop();
    // Parse expenseID from filename: receipt_YYYY-MM-DD_expenseID=<UUID>[_N].ext
    const m=fname.match(/expenseID=([a-f0-9\-]+)/i);
    if(!m){skipped++;continue;}
    const expId=m[1];
    const txnId=expIdToTxnId[expId];
    if(!txnId){skipped++;continue;}
    // Check if this exact file is already attached
    const existing=await ATT.getByTxn(txnId);
    if(existing.some(a=>a.name===fname)){continue;}
    // Determine MIME type
    const ext=fname.split('.').pop().toLowerCase();
    const mimeMap={jpeg:'image/jpeg',jpg:'image/jpeg',png:'image/png',pdf:'application/pdf'};
    const mime=mimeMap[ext]||'application/octet-stream';
    // Read file data as base64
    const b64=await entry.async('base64');
    const dataUri='data:'+mime+';base64,'+b64;
    // Estimate size
    const sizeBytes=Math.round(b64.length*3/4);
    if(sizeBytes>5*1024*1024){skipped++;continue;}
    // Create thumbnail for images
    let thumb=null;
    if(mime.startsWith('image/')){
      try{thumb=await makeThumbnail(dataUri);}catch(e){}
    }
    const att={id:uid(),txnId:txnId,name:fname,type:mime,size:sizeBytes,data:dataUri,thumb:thumb};
    await ATT.save(att);
    matched++;
  }
  const prev=S.importMsg||'';
  S.importMsg=prev+(matched?` | ${matched} receipts auto-matched`:'')+(skipped?` (${skipped} receipts skipped)`:'');
  render();
  setTimeout(()=>{S.importMsg=null;const el=document.getElementById('importMsg');if(el)el.remove();},8000);
}
// Smart import: detects CSV or ZIP and routes accordingly
function handleImportFile(file){
  if(!file)return;
  const name=file.name.toLowerCase();
  if(name.endsWith('.zip'))importZIP(file);
  else if(name.endsWith('.csv'))importCSV(file);
  else alert('Unsupported file type. Please upload a .csv or .zip file.');
}

function renderTransactions(){

  if(S.filterMember)txns=txns.filter(t=>t.memberId===S.filterMember);
  if(!S.showAssigned)txns=txns.filter(t=>!t.reportId);
  if(S.filterDateFrom){const iso=displayToIso(S.filterDateFrom);if(iso)txns=txns.filter(t=>t.date>=iso);}
  if(S.filterDateTo){const iso=displayToIso(S.filterDateTo);if(iso)txns=txns.filter(t=>t.date<=iso);}
  if(S.searchQuery){const q=S.searchQuery.toLowerCase();txns=txns.filter(t=>{const mem=members.find(m=>m.id===t.memberId);return(t.merchant||'').toLowerCase().includes(q)||(t.description||'').toLowerCase().includes(q)||(t.revolCategory||'').toLowerCase().includes(q)||(t.txnNote||'').toLowerCase().includes(q)||(mem&&mem.name.toLowerCase().includes(q))||String(t.amount).includes(q);});}
  txns.sort((a,b)=>b.date.localeCompare(a.date));
  const selCount=[...S.selectedTxns].filter(id=>txns.some(t=>t.id===id&&!t.reportId)).length;
  const selTotal=txns.filter(t=>S.selectedTxns.has(t.id)&&!t.reportId).reduce((s,t)=>s+t.amount,0);

  if(!allTxns.length){
    return`<div class="text-center mb-6"><h2 class="text-2xl font-bold">Import Revolut Transactions</h2><p class="text-sm text-gray-500 mt-1">Upload your Revolut CSV to get started</p></div>
      <div class="upload-zone" id="uploadZone"><input type="file" id="csvFile" accept=".csv,.zip" class="hidden">
        <svg style="width:48px;height:48px;color:var(--blue-400);margin:0 auto 12px"><use href="#ico-upload"/></svg>
        <p class="font-semibold text-gray-700">Drop your Revolut CSV or ZIP here</p>
        <p class="text-sm text-gray-400 mt-1">or click to browse (.csv or .zip with receipts)</p>
      </div>${S.importMsg?`<div class="success-box mt-4" id="importMsg">${esc(S.importMsg)}</div>`:''}`;
  }

  const memberOpts=members.map(m=>{const cnt=allTxns.filter(t=>t.memberId===m.id&&(S.showAssigned||!t.reportId)).length;return{id:m.id,name:m.name,count:cnt};}).filter(m=>m.count>0).sort((a,b)=>a.name.localeCompare(b.name));

  return`
    <div class="flex items-center justify-between mb-6 flex-wrap gap-3">
      <h2 class="text-xl font-bold">Transactions</h2>
      <div class="flex gap-2">${txns.some(t=>!t.reportId)?`<button class="btn btn-primary btn-sm" onclick="autoGenerateReports()"><svg class="icon-sm"><use href="#ico-zap"/></svg> Auto-generate Reports</button>`:''}<button class="btn btn-secondary btn-sm" onclick="triggerImport()"><svg class="icon-sm"><use href="#ico-upload"/></svg> Import CSV/ZIP</button><input type="file" id="csvFile" accept=".csv,.zip" class="hidden"></div>
    </div>
    ${S.importMsg?`<div class="success-box mb-4" id="importMsg">${esc(S.importMsg)}</div>`:''}
    <div class="flex items-center justify-between mb-4 flex-wrap gap-3">
      <div class="flex items-center gap-3 flex-wrap">
        <div style="position:relative"><svg style="position:absolute;left:8px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--gray-400);pointer-events:none"><use href="#ico-search"/></svg><input type="text" id="searchInput" placeholder="Search transactions..." value="${esc(S.searchQuery)}" oninput="searchDebounce(this)" style="padding-left:28px;width:200px;font-size:12px;padding-top:6px;padding-bottom:6px">${S.searchQuery?`<button onclick="S.searchQuery='';S.selectedTxns=new Set();render();" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--gray-400);font-size:14px;line-height:1">&times;</button>`:''}</div>
        <select style="width:auto;min-width:220px" onchange="S.filterMember=this.value;S.selectedTxns=new Set();render();">
          <option value="">All Members (${txns.length})</option>
          ${memberOpts.map(m=>`<option value="${m.id}"${S.filterMember===m.id?' selected':''}>${esc(m.name)} (${m.count})</option>`).join('')}
        </select>
        <div class="flex items-center gap-2">
          <input type="text" placeholder="From dd/mm/yyyy" value="${esc(S.filterDateFrom)}" maxlength="10" style="width:130px;font-size:12px;padding:6px 8px" oninput="autoSlashDate(this)" onchange="S.filterDateFrom=this.value;S.selectedTxns=new Set();render();">
          <span class="text-xs text-gray-400">&mdash;</span>
          <input type="text" placeholder="To dd/mm/yyyy" value="${esc(S.filterDateTo)}" maxlength="10" style="width:130px;font-size:12px;padding:6px 8px" oninput="autoSlashDate(this)" onchange="S.filterDateTo=this.value;S.selectedTxns=new Set();render();">
          ${S.filterDateFrom||S.filterDateTo?`<button class="btn btn-ghost btn-sm" onclick="S.filterDateFrom='';S.filterDateTo='';S.selectedTxns=new Set();render();" title="Clear dates" style="padding:4px 6px"><svg class="icon-sm" style="color:var(--gray-400)"><use href="#ico-x"/></svg></button>`:''}
        </div>
        <label class="text-sm text-gray-500 flex items-center gap-2" style="cursor:pointer"><input type="checkbox" ${S.showAssigned?'checked':''} onchange="S.showAssigned=this.checked;S.selectedTxns=new Set();render();"> Show assigned</label>
      </div>
      ${selCount?(()=>{const selTxns=txns.filter(t=>S.selectedTxns.has(t.id)&&!t.reportId);const hasTP=selTxns.some(t=>t.revolCategory==='Third Party Payments');const hasExp=selTxns.some(t=>t.revolCategory!=='Third Party Payments');const mixed=hasTP&&hasExp;
        return`<div class="flex items-center gap-3 flex-wrap">
        <span class="badge badge-blue" style="font-size:13px;padding:4px 14px">${selCount} selected &middot; \u20ac${selTotal.toFixed(2)}</span>
        ${mixed?'<span class="text-xs" style="color:var(--amber-600)">Mixed selection (Expenses + Third Party)</span>':''}
        ${!hasTP||mixed?`<button class="btn btn-primary btn-sm" onclick="createReportFromSelected('expense')"><svg class="icon-sm"><use href="#ico-plus"/></svg> Expense Report</button>`:''}
        ${hasTP?`<button class="btn btn-sm" style="background:var(--amber-500);color:white;border:none" onclick="createReportFromSelected('thirdparty')"><svg class="icon-sm"><use href="#ico-plus"/></svg> Third Party Report</button>`:''}
        <button class="btn btn-danger btn-sm" onclick="deleteSelectedTxns()"><svg class="icon-sm"><use href="#ico-trash"/></svg> Delete (${selCount})</button>
      </div>`;})():''}
    </div>
    ${txns.length?`<div class="card card-shadow overflow-x-auto"><table class="data-table">
      <thead><tr><th style="width:40px"><input type="checkbox" onchange="toggleSelectAll(this.checked)"></th><th>Date</th><th>Member</th><th>Merchant</th><th>Category</th><th>Description</th><th class="text-right">Amount</th><th>Status</th><th style="width:32px" title="Notes"><svg style="width:14px;height:14px;color:var(--gray-400)"><use href="#ico-note"/></svg></th><th style="width:32px" title="Attachments"><svg style="width:14px;height:14px;color:var(--gray-400)"><use href="#ico-paperclip"/></svg></th></tr></thead>
      <tbody>${txns.map(t=>{const mem=members.find(m=>m.id===t.memberId);const sel=S.selectedTxns.has(t.id);const asgn=!!t.reportId;const isTPP=t.revolCategory==='Third Party Payments';
        return`<tr style="${isTPP&&!asgn?'background:var(--amber-50);border-left:3px solid var(--amber-400)':asgn?'opacity:.5':''}${sel?';background:var(--blue-50)':''}">
          <td><input type="checkbox" ${sel?'checked':''}${asgn?' disabled':''} onchange="toggleTxn('${t.id}',this.checked)"></td>
          <td class="whitespace-nowrap">${fmtDate(t.date)}</td>
          <td class="text-sm font-medium">${esc(mem?mem.name:t.payer)}</td>
          <td class="text-sm">${esc(t.merchant)}</td>
          <td class="text-xs">${isTPP?'<span class="badge badge-amber">Third Party</span>':(t.revolCategory?'<span class="badge badge-gray">'+esc(t.revolCategory)+'</span>':'')}</td>
          <td class="text-sm truncate" style="max-width:200px">${esc(t.description)}</td>
          <td class="text-right font-semibold">\u20ac${t.amount.toFixed(2)}</td>
          <td>${asgn?'<span class="badge badge-green">Assigned</span>':'<span class="badge badge-gray">Pending</span>'}</td>
          <td class="text-center"><button class="txn-note-btn${t.txnNote?' has-note':''}" onclick="event.stopPropagation();openTxnNote('${t.id}',this)" title="${t.txnNote?esc(t.txnNote):'Add note'}"><svg style="width:14px;height:14px"><use href="#ico-note"/></svg>${t.txnNote?'<span style="width:6px;height:6px;background:var(--blue-500);border-radius:50%;display:inline-block"></span>':''}</button></td>
          <td class="text-center" id="att_${t.id}"></td>
        </tr>`;}).join('')}</tbody></table></div>`
    :`<div class="empty-state"><h3>No transactions</h3><p>${S.filterMember?'No transactions for this member':'No unassigned transactions'}</p></div>`}`;
}

function toggleTxn(id,checked){if(checked)S.selectedTxns.add(id);else S.selectedTxns.delete(id);render();}
function toggleSelectAll(checked){
  let txns=DB.getTxns();
  if(S.filterMember)txns=txns.filter(t=>t.memberId===S.filterMember);
  txns=txns.filter(t=>!t.reportId);
  if(checked)txns.forEach(t=>S.selectedTxns.add(t.id));else txns.forEach(t=>S.selectedTxns.delete(t.id));
  render();
}

function deleteSelectedTxns(){
  const txns=DB.getTxns();
  const toDelete=[...S.selectedTxns].filter(id=>{const t=txns.find(x=>x.id===id);return t&&!t.reportId;});
  if(!toDelete.length)return;
  if(!confirm('Delete '+toDelete.length+' transaction(s)? This cannot be undone.'))return;
  const delSet=new Set(toDelete);
  // Delete attachments for each
  toDelete.forEach(id=>{ATT.delByTxn(id).catch(()=>{});});
  DB.saveTxns(txns.filter(t=>!delSet.has(t.id)));
  S.selectedTxns=new Set();render();
}

function openTxnNote(txnId,btnEl){
  closeTxnNote();
  const txns=DB.getTxns();const t=txns.find(x=>x.id===txnId);if(!t)return;
  const rect=btnEl.getBoundingClientRect();
  const pop=document.createElement('div');pop.className='note-popover';pop.id='notePopover';
  // Position: try right of button, fallback left if off-screen
  let left=rect.right+8;let top=rect.top-10;
  if(left+290>window.innerWidth)left=rect.left-290;
  if(top+160>window.innerHeight)top=window.innerHeight-170;
  pop.style.left=left+'px';pop.style.top=Math.max(8,top)+'px';
  pop.innerHTML=`<div class="text-xs font-semibold text-gray-500 mb-2">${esc(t.merchant)} — ${fmtDate(t.date)}</div>
    <textarea id="noteText" placeholder="Add a note...">${esc(t.txnNote||'')}</textarea>
    <div class="note-actions">
      <button class="btn btn-ghost btn-sm" onclick="closeTxnNote()">Cancel</button>
      <button class="btn btn-primary btn-sm" onclick="saveTxnNote('${txnId}')">Save</button>
    </div>`;
  document.body.appendChild(pop);
  const ta=document.getElementById('noteText');if(ta){ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);}
  // Close on click outside
  setTimeout(()=>{document.addEventListener('mousedown',_noteOutsideClick);},10);
}
function _noteOutsideClick(e){const pop=document.getElementById('notePopover');if(pop&&!pop.contains(e.target))closeTxnNote();}
function closeTxnNote(){const pop=document.getElementById('notePopover');if(pop)pop.remove();document.removeEventListener('mousedown',_noteOutsideClick);}
function saveTxnNote(txnId){
  const ta=document.getElementById('noteText');if(!ta)return;
  const txns=DB.getTxns();const t=txns.find(x=>x.id===txnId);
  if(t){t.txnNote=ta.value.trim();DB.saveTxns(txns);}
  closeTxnNote();render();
}

// MONTHLY REVIEW
// ═══════════════════════════════════════════════════════════════
function renderReview(){
  const allTxns=DB.getTxns();const members=DB.getMembers();
  const unassigned=allTxns.filter(t=>!t.reportId);
  // Collect available months from unassigned txns
  const monthSet=new Set();unassigned.forEach(t=>{if(t.date)monthSet.add(t.date.substring(0,7));});
  const months=[...monthSet].sort().reverse();
  if(!S.reviewMonth&&months.length)S.reviewMonth=months[0];
  const sel=S.reviewMonth;
  const monthTxns=unassigned.filter(t=>t.date&&t.date.substring(0,7)===sel).sort((a,b)=>a.date.localeCompare(b.date));
  // Group by member
  const byMember={};
  monthTxns.forEach(t=>{if(!byMember[t.memberId])byMember[t.memberId]=[];byMember[t.memberId].push(t);});
  const memberGroups=Object.keys(byMember).map(mid=>{const mem=members.find(m=>m.id===mid);return{member:mem,txns:byMember[mid]};}).sort((a,b)=>(a.member?a.member.name:'').localeCompare(b.member?b.member.name:''));
  const totalAmount=monthTxns.reduce((s,t)=>s+t.amount,0);
  const expTxns=monthTxns.filter(t=>t.revolCategory!=='Third Party Payments');
  const tpTxns=monthTxns.filter(t=>t.revolCategory==='Third Party Payments');

  return`
    <div class="flex items-center justify-between mb-6 flex-wrap gap-3">
      <h2 class="text-xl font-bold"><svg class="icon-sm" style="vertical-align:text-bottom;margin-right:6px"><use href="#ico-calendar"/></svg>Monthly Review</h2>
      <div class="flex gap-2">
        ${monthTxns.length?`<button class="btn btn-sm" style="background:var(--green-600);color:#fff;border:none" onclick="exportReviewExcel()"><svg class="icon-sm"><use href="#ico-file-spreadsheet"/></svg> Export Excel</button>`:''}
        ${monthTxns.length?`<button class="btn btn-primary btn-sm" onclick="reviewAutoGenerate()"><svg class="icon-sm"><use href="#ico-zap"/></svg> Auto-generate Reports</button>`:''}
      </div>
    </div>
    ${months.length?`<div class="flex gap-2 flex-wrap mb-6">
      ${months.map(m=>`<button class="month-pill ${sel===m?'active':''}" onclick="S.reviewMonth='${m}';S.reviewAttCache={};render();reviewLoadAttFlags();">${fmtMonth(m+'-01')}</button>`).join('')}
    </div>`:''}
    ${monthTxns.length?`
    <div class="grid grid-4 gap-4 mb-6">
      <div class="stat-card stat-accent card-shadow"><div class="label">Open Transactions</div><div class="value">${monthTxns.length}</div></div>
      <div class="stat-card card-shadow"><div class="label">Total Amount</div><div class="value">\u20ac${totalAmount.toFixed(2)}</div></div>
      <div class="stat-card card-shadow"><div class="label">Expenses</div><div class="value">${expTxns.length} &middot; \u20ac${expTxns.reduce((s,t)=>s+t.amount,0).toFixed(2)}</div></div>
      <div class="stat-card card-shadow" style="border-left:3px solid var(--amber-600)"><div class="label">Third Party</div><div class="value">${tpTxns.length} &middot; \u20ac${tpTxns.reduce((s,t)=>s+t.amount,0).toFixed(2)}</div></div>
    </div>
    <div class="text-xs text-gray-500 mb-3">${memberGroups.length} member(s) with open transactions</div>
    ${memberGroups.map(g=>{
      const mem=g.member;const mName=mem?mem.name:'Unknown';
      const mTotal=g.txns.reduce((s,t)=>s+t.amount,0);
      const mExp=g.txns.filter(t=>t.revolCategory!=='Third Party Payments');
      const mTP=g.txns.filter(t=>t.revolCategory==='Third Party Payments');
      return`<div class="review-member-section">
        <div class="review-member-header" onclick="this.parentElement.classList.toggle('collapsed')">
          <h4>${esc(mName)} <span class="text-xs text-gray-400 font-normal" style="margin-left:8px">${g.txns.length} txns</span>
            ${mExp.length?` <span class="badge badge-blue" style="font-size:10px">${mExp.length} exp</span>`:''}
            ${mTP.length?` <span class="badge badge-amber" style="font-size:10px">${mTP.length} TP</span>`:''}
          </h4>
          <span class="text-lg font-bold">\u20ac${mTotal.toFixed(2)}</span>
        </div>
        <div class="card-body" style="padding:0"><div class="overflow-x-auto"><table class="data-table" style="margin:0">
          <thead><tr><th>Date</th><th>Merchant</th><th>Category</th><th>Description</th><th>Notes</th><th class="text-right">Amount</th><th style="width:32px" title="Attachments"><svg style="width:12px;height:12px;color:var(--gray-400)"><use href="#ico-paperclip"/></svg></th></tr></thead>
          <tbody>${g.txns.map(t=>{
            const isTP=t.revolCategory==='Third Party Payments';
            const attCount=S.reviewAttCache[t.id];
            const attLoaded=attCount!==undefined;
            return`<tr style="${isTP?'background:var(--amber-50)':''}">
              <td class="whitespace-nowrap text-xs">${fmtDate(t.date)}</td>
              <td class="text-sm">${esc(t.merchant)}</td>
              <td class="text-xs">${isTP?'<span class="badge badge-amber">Third Party</span>':(t.revolCategory?'<span class="badge badge-gray">'+esc(t.revolCategory)+'</span>':'')}</td>
              <td class="text-xs truncate" style="max-width:180px">${esc(t.description)}</td>
              <td class="text-xs" style="max-width:150px;white-space:pre-line;color:var(--gray-600)">${t.txnNote?esc(t.txnNote):''}</td>
              <td class="text-right text-sm font-semibold">\u20ac${t.amount.toFixed(2)}</td>
              <td class="text-center">${attLoaded?(attCount>0?'<svg style="width:13px;height:13px;color:var(--blue-500)"><use href="#ico-paperclip"/></svg>':'<span class="text-xs" style="color:var(--red-400)">\u2014</span>'):'<span class="text-xs text-gray-300">...</span>'}</td>
            </tr>`;}).join('')}</tbody>
          <tfoot><tr><td colspan="5" class="text-right text-xs font-semibold">Subtotal</td><td class="text-right font-bold">\u20ac${mTotal.toFixed(2)}</td><td></td></tr></tfoot>
        </table></div></div>
      </div>`;}).join('')}
    `:`<div class="empty-state"><svg style="margin:0 auto 16px"><use href="#ico-calendar"/></svg><h3>${months.length?'No open transactions for this month':'No open transactions'}</h3><p>${months.length?'All transactions have been assigned to reports':'Import transactions to get started'}</p></div>`}`;
}
let _reviewAttLoading=false;
async function reviewLoadAttFlags(){
  if(!ATT._ready||_reviewAttLoading)return;
  _reviewAttLoading=true;
  const allTxns=DB.getTxns().filter(t=>!t.reportId);
  const sel=S.reviewMonth;
  const monthTxns=allTxns.filter(t=>t.date&&t.date.substring(0,7)===sel);
  for(const t of monthTxns){
    if(S.reviewAttCache[t.id]!==undefined)continue;
    try{const items=await ATT.getByTxn(t.id);S.reviewAttCache[t.id]=items.length;}catch(e){S.reviewAttCache[t.id]=0;}
  }
  _reviewAttLoading=false;
  if(S.screen==='review')render();
}
function reviewAutoGenerate(){
  const sel=S.reviewMonth;if(!sel)return;
  const allTxns=DB.getTxns();
  const monthTxns=allTxns.filter(t=>!t.reportId&&t.date&&t.date.substring(0,7)===sel);
  if(!monthTxns.length)return;
  // Select them all and go to autoGen wizard
  const memberIds=[...new Set(monthTxns.map(t=>t.memberId))];
  const members=DB.getMembers().filter(m=>memberIds.includes(m.id));
  S.autoGen={step:1,members,selectedMemberId:null,txns:[],excluded:new Set(),attCache:{}};
  setState({screen:'autoGen'});
}
function exportReviewExcel(){
  if(typeof XLSX==='undefined'){alert('SheetJS library not loaded. Please refresh.');return;}
  const sel=S.reviewMonth;if(!sel)return;
  const allTxns=DB.getTxns();const members=DB.getMembers();
  const monthTxns=allTxns.filter(t=>!t.reportId&&t.date&&t.date.substring(0,7)===sel).sort((a,b)=>a.date.localeCompare(b.date));
  if(!monthTxns.length){alert('No transactions to export.');return;}
  // Build rows
  const headers=['Date','Member','Merchant','Category','Description','Amount (EUR)','Currency','Card Number','Invoice Type','Invoice Number','Car Plate','Receipts','Tax Name','Tax Rate','Tax Amount','Revolut Category','Expense ID','Transaction ID','Notes','Imported At'];
  const rows=monthTxns.map(t=>{
    const mem=members.find(m=>m.id===t.memberId);
    return[
      fmtDate(t.date),mem?mem.name:t.payer,t.merchant||'',t.revolCategory||'',
      t.description||'',t.amount||0,t.currency||'EUR',t.cardNumber||'',
      '','','',t.receipts||0,t.taxName||'',t.taxRate||'',t.taxAmount||0,
      t.revolCategory||'',t.expenseId||'',t.id||'',t.txnNote||'',t.importedAt||''
    ];
  });
  // Create workbook
  const wb=XLSX.utils.book_new();
  const wsData=[headers,...rows];
  const ws=XLSX.utils.aoa_to_sheet(wsData);
  // Column widths
  ws['!cols']=[{wch:12},{wch:22},{wch:30},{wch:22},{wch:35},{wch:12},{wch:6},{wch:14},{wch:10},{wch:14},{wch:12},{wch:8},{wch:14},{wch:8},{wch:12},{wch:22},{wch:38},{wch:38},{wch:40},{wch:20}];
  XLSX.utils.book_append_sheet(wb,ws,'Open Transactions');
  // Summary sheet
  const byMember={};monthTxns.forEach(t=>{const mem=members.find(m=>m.id===t.memberId);const n=mem?mem.name:t.payer;if(!byMember[n])byMember[n]={count:0,total:0,exp:0,tp:0};byMember[n].count++;byMember[n].total+=t.amount;if(t.revolCategory==='Third Party Payments')byMember[n].tp+=t.amount;else byMember[n].exp+=t.amount;});
  const sumHeaders=['Member','Transactions','Expenses (EUR)','Third Party (EUR)','Total (EUR)'];
  const sumRows=Object.keys(byMember).sort().map(n=>[n,byMember[n].count,byMember[n].exp,byMember[n].tp,byMember[n].total]);
  sumRows.push(['TOTAL',monthTxns.length,monthTxns.filter(t=>t.revolCategory!=='Third Party Payments').reduce((s,t)=>s+t.amount,0),monthTxns.filter(t=>t.revolCategory==='Third Party Payments').reduce((s,t)=>s+t.amount,0),monthTxns.reduce((s,t)=>s+t.amount,0)]);
  const ws2=XLSX.utils.aoa_to_sheet([sumHeaders,...sumRows]);
  ws2['!cols']=[{wch:22},{wch:14},{wch:16},{wch:18},{wch:14}];
  XLSX.utils.book_append_sheet(wb,ws2,'Summary');
  // Download
  const monthLabel=fmtMonth(sel+'-01').replace(' ','_');
  XLSX.writeFile(wb,'Open_Transactions_'+monthLabel+'.xlsx');
}

// ═══════════════════════════════════════════════════════════════
// AUTO-GENERATE REPORTS (wizard)
// ═══════════════════════════════════════════════════════════════
function autoGenerateReports(){
  const allTxns=DB.getTxns();const unassigned=allTxns.filter(t=>!t.reportId);
  if(!unassigned.length){alert('No unassigned transactions.');return;}
  // Find members with unassigned txns
  const memberIds=[...new Set(unassigned.map(t=>t.memberId))];
  const members=DB.getMembers().filter(m=>memberIds.includes(m.id));
  S.autoGen={step:1,members,selectedMemberId:null,txns:[],excluded:new Set(),attCache:{}};

function agSelectMember(memberId){
  const ag=S.autoGen;if(!ag)return;
  ag.selectedMemberId=memberId;
  const allTxns=DB.getTxns().filter(t=>!t.reportId&&t.memberId===memberId);
  ag.txns=allTxns.sort((a,b)=>a.date.localeCompare(b.date));

  render();

async function agLoadAttFlags(){
  const ag=S.autoGen;if(!ag||!ATT._ready)return;
  for(const t of ag.txns){
    try{const items=await ATT.getByTxn(t.id);ag.attCache[t.id]=items.length;}catch(e){ag.attCache[t.id]=0;}
  }
  // Re-render the list
  const el=document.getElementById('agTxnList');if(el)el.innerHTML=agRenderTxnRows();
}
function agToggleExclude(txnId){
  const ag=S.autoGen;if(!ag)return;
  if(ag.excluded.has(txnId))ag.excluded.delete(txnId);else ag.excluded.add(txnId);
  const el=document.getElementById('agTxnList');if(el)el.innerHTML=agRenderTxnRows();
  const sumEl=document.getElementById('agSummary');if(sumEl)sumEl.innerHTML=agRenderSummary();
}
function agExcludeWithoutAtt(){
  const ag=S.autoGen;if(!ag)return;
  ag.txns.forEach(t=>{if((ag.attCache[t.id]||0)===0)ag.excluded.add(t.id);});
  const el=document.getElementById('agTxnList');if(el)el.innerHTML=agRenderTxnRows();

function agIncludeAll(){

function agRenderTxnRows(){

function agRenderSummary(){
  const ag=S.autoGen;if(!ag)return'';
  const included=ag.txns.filter(t=>!ag.excluded.has(t.id));
  const expTxns=included.filter(t=>t.revolCategory!=='Third Party Payments');
  const tpTxns=included.filter(t=>t.revolCategory==='Third Party Payments');
  const expTotal=expTxns.reduce((s,t)=>s+t.amount,0);
  const tpTotal=tpTxns.reduce((s,t)=>s+t.amount,0);
  let html=`<span class="text-sm"><strong>${included.length}</strong> of ${ag.txns.length} transactions selected</span>`;
  if(expTxns.length)html+=` &nbsp;·&nbsp; <span class="badge badge-blue" style="font-size:11px">Expenses: €${expTotal.toFixed(2)} (${expTxns.length})</span>`;
  if(tpTxns.length)html+=` &nbsp;·&nbsp; <span class="badge badge-amber" style="font-size:11px">TP: €${tpTotal.toFixed(2)} (${tpTxns.length})</span>`;
  return html;
}
function agConfirmGenerate(){
  const ag=S.autoGen;if(!ag)return;
  const included=ag.txns.filter(t=>!ag.excluded.has(t.id));
  if(!included.length){alert('No transactions selected.');return;}
  const mem=DB.getMembers().find(m=>m.id===ag.selectedMemberId);if(!mem)return;
  const allTxns=DB.getTxns();const allReports=DB.getReports();const cats=getCategories();let created=0;
  // Group included by month + type
  const groups={};
  included.forEach(t=>{
    const monthKey=t.date?t.date.substring(0,7):'unknown';
    const isTP=t.revolCategory==='Third Party Payments';
    const typeKey=isTP?'thirdparty':'expense';
    const key=monthKey+'|'+typeKey;
    if(!groups[key])groups[key]={month:monthKey,type:typeKey,txns:[]};
    groups[key].txns.push(t);
  });
  Object.values(groups).forEach(g=>{
    const isTP=g.type==='thirdparty';
    const sorted=g.txns.sort((a,b)=>a.date.localeCompare(b.date));
    const dates=sorted.map(t=>t.date).filter(Boolean);
    const expenses=sorted.map(t=>{
      const revCat=cats.includes(t.revolCategory)?t.revolCategory:'';
      const cat=isTP?'Third Party Payments':(revCat||suggestCategory(t.merchant));
      return{transactionId:t.id,date:t.date,merchant:t.merchant,
      description:t.description||t.merchant,amount:t.amount,
      category:cat,_autoSuggested:!isTP&&!revCat&&!!cat,
      invoiceType:t.receipts>0?'Receipt':'Missing',
      invoiceNumber:'',carPlate:'',chargeToDept:'',caseName:'',clientName:'',notes:t.txnNote||'',
      vatLines:[]};
    });
    const total=expenses.reduce((s,e)=>s+e.amount,0);
    let reason='';
    if(dates[0]){const dt=new Date(dates[0]);const months=['January','February','March','April','May','June','July','August','September','October','November','December'];reason=months[dt.getMonth()]+' '+dt.getFullYear()+(isTP?' Third Party Payments':' Expenses');}
    const rType=isTP?'thirdparty':'expense';
    const rNum=rType==='thirdparty'?DB.nextCounterTP():DB.nextCounter();
    const report={id:uid(),reportNumber:rNum,reportType:rType,memberId:mem.id,memberName:mem.name,periodFrom:dates[0]||'',periodTo:dates[dates.length-1]||'',reason,expenses,total,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),autoDraft:true};
    allReports.push(report);
    sorted.forEach(t=>{const tx=allTxns.find(x=>x.id===t.id);if(tx)tx.reportId=report.id;});
    created++;
  });
  DB.saveTxns(allTxns);DB.saveReports(allReports);
  // Check if there are more members to process
  const remaining=DB.getTxns().filter(t=>!t.reportId);
  const remainingMembers=[...new Set(remaining.map(t=>t.memberId))];
  if(remainingMembers.length){
    S.autoGen={step:1,members:DB.getMembers().filter(m=>remainingMembers.includes(m.id)),selectedMemberId:null,txns:[],excluded:new Set(),attCache:{}};
    S.importMsg=`Created ${created} report(s) for ${mem.name} — ${remainingMembers.length} member(s) remaining`;
    render();
    setTimeout(()=>{S.importMsg=null;const el=document.getElementById('importMsg');if(el)el.remove();},5000);
  }else{
    S.autoGen=null;S.selectedTxns=new Set();
    S.importMsg=`Created ${created} report(s) for ${mem.name} — all done!`;
    setState({screen:'reports'});
    setTimeout(()=>{S.importMsg=null;const el=document.getElementById('importMsg');if(el)el.remove();},5000);
  }
}

        <div class="text-right"><div class="text-lg font-bold">\u20ac${total.toFixed(2)}</div></div>
      </div>`;}).join('')}</div>`;
  }else if(ag.step===2){
    const mem=members.find(m=>m.id===ag.selectedMemberId);
    html+=`<div class="flex items-center justify-between mb-4">
      <div><span class="font-semibold">${esc(mem?mem.name:'')}</span>
        <button class="btn btn-ghost btn-sm" onclick="S.autoGen.step=1;render();" style="margin-left:8px;font-size:11px">&larr; Change member</button></div>

    <div id="agTxnList">${agRenderTxnRows()}</div>

      <button class="btn btn-primary btn-md" onclick="agConfirmGenerate()"><svg class="icon-sm"><use href="#ico-check"/></svg> Generate Report(s)</button>
    </div>`;

  return html;

function createReportFromSelected(forceType){
  const txns=DB.getTxns().filter(t=>S.selectedTxns.has(t.id)&&!t.reportId);
  if(!txns.length)return;
  const memberIds=[...new Set(txns.map(t=>t.memberId))];
  if(memberIds.length>1){alert('Please select transactions from only one member.');return;}
  const member=DB.getMemberById(memberIds[0]);
  if(!member){alert('Member not found.');return;}
  const dates=txns.map(t=>t.date).filter(Boolean).sort();
  const isTP=forceType==='thirdparty';
  const expenses=txns.sort((a,b)=>a.date.localeCompare(b.date)).map(t=>{
    const revCat=getCategories().includes(t.revolCategory)?t.revolCategory:'';
    const cat=isTP?'Third Party Payments':(revCat||suggestCategory(t.merchant));
    return{transactionId:t.id,date:t.date,merchant:t.merchant,
    description:t.description||t.merchant,amount:t.amount,
    category:cat,_autoSuggested:!isTP&&!revCat&&!!cat,
    invoiceType:t.receipts>0?'Receipt':'Missing',
    invoiceNumber:'',carPlate:'',chargeToDept:'',caseName:'',clientName:'',notes:t.txnNote||'',
    vatLines:[],_ocrProcessing:false,_ocrDone:false};
  });
  let reason='';
  if(dates[0]){const dt=new Date(dates[0]);const months=['January','February','March','April','May','June','July','August','September','October','November','December'];reason=months[dt.getMonth()]+' '+dt.getFullYear()+(isTP?' Third Party Payments':' Expenses');}
  S.editingExpenses=expenses;
  const detectedTP=forceType?forceType==='thirdparty':expenses.every(e=>e.category==='Third Party Payments');
  S.editMeta={memberId:member.id,memberName:member.name,periodFrom:dates[0]||'',periodTo:dates[dates.length-1]||'',reason,reportType:detectedTP?'thirdparty':'expense'};
  S.currentReport=null;
  setState({screen:'reportForm'});
}

" value="'+(v.vat!=null?v.vat:'')+'" placeholder="0.00" oninput="updVatLine('+idx+','+vi+',\'vat\',this.value)" style="font-size:13px;background:var(--gray-50)"></div><button type="button" class="btn btn-ghost btn-sm" onclick="removeVatLine('+idx+','+vi+')" title="Remove" style="padding:2px 6px;color:var(--red-500);margin-top:16px">&times;</button></div>';}).join('')+'<div class="flex items-center justify-between" style="padding-top:6px;border-top:1px solid var(--gray-200)"><div class="flex items-center gap-2"><div class="text-xs text-gray-500">Net: \u20ac'+vl.reduce((s,v)=>s+(v.net||0),0).toFixed(2)+' | VAT: \u20ac'+vl.reduce((s,v)=>s+(v.vat||0),0).toFixed(2)+' | Sum: \u20ac'+vl.reduce((s,v)=>s+(v.net||0)+(v.vat||0),0).toFixed(2)+'</div><button type="button" class="btn btn-ghost btn-sm" onclick="addVatLine('+idx+')" style="font-size:10px;padding:2px 6px;color:var(--emerald-600)">+ line</button></div><div class="text-xs font-bold">Txn Total: \u20ac'+exp.amount.toFixed(2)+'</div></div>';})()}
      </div>
      <div class="attachments-section">
        <div class="flex items-center justify-between">
          <label class="text-xs font-medium text-gray-500 uppercase tracking-wide">Attachments</label>
          <div class="flex items-center gap-2">
            <input type="file" id="attFile_${idx}" accept=".jpg,.jpeg,.png,.pdf" multiple class="hidden" onchange="handleAttach(${idx},event)">
            <button type="button" class="btn btn-secondary btn-sm" onclick="document.getElementById('attFile_${idx}').click()"><svg class="icon-sm"><use href="#ico-paperclip"/></svg> Attach</button>
          </div>
        </div>
        <div class="attachment-list" id="attList_${idx}"><span class="text-xs text-gray-400">Loading...</span></div>
      </div>
    </div>`;
  }).join('');
  S.editingExpenses.forEach((exp,idx)=>{loadAttList(idx,exp.transactionId);});
}

function updExp(idx,key,val){S.editingExpenses[idx][key]=val;}

function quickVAT(idx,rate){
  // One-click deduction: from total amount, calculate net & vat for single rate
  const exp=S.editingExpenses[idx];if(!exp)return;
  const total=exp.amount;
  const net=rate===0?total:Math.round(total/(1+rate/100)*100)/100;
  const vat=Math.round((total-net)*100)/100;
  exp.vatLines=[{rate:rate,net:net,vat:vat,lineTotal:total}];
  renderExpCards();
}
function addVatLine(idx){
  const exp=S.editingExpenses[idx];if(!exp)return;
  if(!exp.vatLines)exp.vatLines=[];
  exp.vatLines.push({rate:null,net:null,vat:null,lineTotal:null});
  renderExpCards();
}
function removeVatLine(idx,vi){
  const exp=S.editingExpenses[idx];if(!exp||!exp.vatLines)return;
  exp.vatLines.splice(vi,1);
  renderExpCards();
}
let _vatLineTimer=null;
function updVatLine(idx,vi,key,val){
  const exp=S.editingExpenses[idx];if(!exp||!exp.vatLines||!exp.vatLines[vi])return;
  const vl=exp.vatLines[vi];
  const v=val===''?null:parseFloat(val);
  vl[key]=v;
  // Priority 1: Rate + LineTotal → Net + VAT (most common manual use)
  if((key==='lineTotal'||key==='rate')&&vl.lineTotal!=null&&vl.rate!=null){
    vl.net=Math.round(vl.lineTotal/(1+vl.rate/100)*100)/100;
    vl.vat=Math.round((vl.lineTotal-vl.net)*100)/100;
  }
  // Priority 2: Rate + Net → VAT + LineTotal
  else if((key==='net'||key==='rate')&&vl.net!=null&&vl.rate!=null){
    vl.vat=Math.round(vl.net*vl.rate/100*100)/100;
    vl.lineTotal=Math.round((vl.net+vl.vat)*100)/100;
  }
  // Priority 3: Net + VAT → infer rate + lineTotal
  else if(key==='vat'&&vl.net!=null&&vl.vat!=null&&vl.net>0){
    vl.lineTotal=Math.round((vl.net+vl.vat)*100)/100;
    const r=Math.round(vl.vat/vl.net*100);
    if([0,6,13,24].includes(r))vl.rate=r;
  }
  // Debounced re-render to preserve focus while typing
  clearTimeout(_vatLineTimer);
  if(key==='rate'){
    // Select dropdown: render immediately (no typing involved)
    renderExpCards();
  } else {
    _vatLineTimer=setTimeout(()=>{
      const ae=document.activeElement;
      const aeId=ae?ae.getAttribute('data-vatfield'):'';
      renderExpCards();
      if(aeId){
        const el=document.querySelector('[data-vatfield="'+aeId+'"]');
        if(el){el.focus();try{el.setSelectionRange(el.value.length,el.value.length);}catch(e){}}
      }
    },400);
  }
}

function removeExpense(idx){
  const exp=S.editingExpenses[idx];if(!exp)return;
  if(!confirm('Remove "'+exp.merchant+'" from this report? It will return to unassigned transactions.'))return;
  // Unassign the transaction
  const txns=DB.getTxns();const t=txns.find(tx=>tx.id===exp.transactionId);
  if(t){t.reportId=null;DB.saveTxns(txns);}
  // Delete attachments for this expense
  ATT.delByTxn(exp.transactionId).catch(()=>{});
  // Remove from editing list
  S.editingExpenses.splice(idx,1);
  // Update total in form
  render();
}

// ═══════════════════════════════════════════════════════════════
// OCR — Extract VAT from attachments
// ═══════════════════════════════════════════════════════════════
let _ocrWorker=null;
async function getOCRWorker(){
  if(_ocrWorker)return _ocrWorker;
  if(!window.Tesseract){console.warn('Tesseract.js not loaded');return null;}
  _ocrWorker=await Tesseract.createWorker('ell+eng',1,{workerPath:'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js',corePath:'https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.0/tesseract-core.wasm.js'});
  return _ocrWorker;
}

async function ocrExtractVAT(b64data,mimeType){
  try{
    let imageData=b64data;
    // If PDF, render first page to image
    if(mimeType==='application/pdf'){
      if(!window.pdfjsLib)return null;
      const raw=atob(b64data.split(',')[1]);const arr=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)arr[i]=raw.charCodeAt(i);
      const pdf=await pdfjsLib.getDocument({data:arr}).promise;
      const page=await pdf.getPage(1);const vp=page.getViewport({scale:2});
      const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;
      await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
      imageData=c.toDataURL('image/jpeg',0.9);
    }
    const worker=await getOCRWorker();
    if(!worker)return null;
    const{data:{text}}=await worker.recognize(imageData);
    return parseVATFromText(text);
  }catch(e){console.error('OCR error:',e);return null;}
}

function parseVATFromText(text){
  if(!text)return null;
  const lines=text.replace(/\r/g,'').split('\n').map(l=>l.trim()).filter(Boolean);
  const allText=lines.join(' ');
  // Normalize Greek decimal: 1.234,56 → 1234.56
  const norm=s=>s.replace(/\./g,'').replace(',','.').replace(/[^\d.]/g,'');
  const vatLines=[];

  // ─── Phase 1: Multi-rate detection (line-by-line) ───
  // Greek invoices with multiple VAT rates list them as:
  //   Α 24%  40,32  9,68   or   ΦΠΑ 24%: 9,68
  //   Β 13%  20,00  2,60        ΦΠΑ 13%: 2,60
  for(const line of lines){
    // Pattern: "24%  40,32  9,68" or "Α 24% 40,32 9,68" or "ΦΠΑ Α 24% 40,32 9,68"
    const rateLineRe=/(\d+)\s*%\s+[€]?\s*([\d.,]+)\s+[€]?\s*([\d.,]+)/;
    const m=line.match(rateLineRe);
    if(m){
      const rate=parseInt(m[1]);const net=parseFloat(norm(m[2]));const vat=parseFloat(norm(m[3]));
      if([0,6,13,24].includes(rate)&&net>0){vatLines.push({rate,net,vat:vat||Math.round(net*rate/100*100)/100});}
    }
  }
  if(vatLines.length)return{vatLines};

  // ─── Phase 2: Single VAT detection (full text) ───
  let netAmount=null,vatRate=null,vatAmount=null;

  // Greek VAT identifier patterns (ΦΠΑ, Φ.Π.Α., φπα, φόρος, etc.)
  const fpaRe='(?:Φ\\.?\\s*Π\\.?\\s*Α\\.?|ΦΠΑ|φπα|φ\\.?π\\.?α\\.?|VAT|ΦΟΡΟΣ|Φ[ΟΌ]ΡΟΣ\\s*ΠΡΟΣΤ|ΦΟΡΟΣ\\s*ΠΡΟΣΤΙΘ)';

  // Net amount: ΚΑΘΑΡΗ ΑΞΙΑ, ΑΞΙΑ ΧΩΡΙΣ ΦΠΑ, ΑΞΙΑ ΠΡΟ ΦΠΑ, ΥΠΟΣΥΝΟΛΟ, etc.
  const netPatterns=[
    new RegExp('(?:ΚΑΘΑΡ[ΗΉ]\\s*ΑΞ[ΙΊ]Α|ΚΑΘ\\.?\\s*ΑΞ[ΙΊ]Α|ΑΞΙΑ\\s*(?:ΠΡΟ|ΧΩΡ[ΙΊ]Σ|ΑΝΕΥ)\\s*'+fpaRe+'|NET\\s*(?:AMOUNT|VALUE)|SUBTOTAL|ΥΠΟΣ[ΥΎ]ΝΟΛΟ|ΦΟΡΟΛΟΓΗΤ[ΕΈ]Α\\s*ΑΞ[ΙΊ]Α|ΦΟΡΟΛ\\.?\\s*ΑΞ[ΙΊ]Α|ΒΑΣΗ\\s*'+fpaRe+')[:\\s]*[€]?\\s*([\\d.,]+)','i'),
    /(?:ΑΞΙΑ|TAXABLE)[:\s]*[€]?\s*([\d.,]+)/i
  ];

  // VAT amount: ΠΟΣΟ ΦΠΑ, ΦΠΑ ΠΟΣΟ, ΠΟΣΟΝ ΦΟΡΟΥ, etc.
  const vatAmtPatterns=[
    new RegExp('(?:ΠΟΣ[ΟΌ]Ν?\\s*'+fpaRe+'|'+fpaRe+'\\s*ΠΟΣ[ΟΌ]Ν?|ΑΝΑΛΟΓΟΥΝ\\s*'+fpaRe+'|'+fpaRe+'\\s*(?:AMOUNT)?|ΣΥΝΟΛ[ΟΌ]\\s*'+fpaRe+'|'+fpaRe+'\\s*ΣΥΝΟΛ[ΟΌ]|TAX\\s*AMOUNT|TAX)[:\\s]*[€]?\\s*([\\d.,]+)','i')
  ];

  // VAT rate: ΦΠΑ 24%, ΣΥΝΤΕΛΕΣΤΗΣ ΦΠΑ, etc.
  const vatRatePatterns=[
    new RegExp(fpaRe+'[:\\s]*(\\d+)\\s*%','i'),
    new RegExp('(\\d+)\\s*%\\s*'+fpaRe,'i'),
    /ΣΥΝΤΕΛΕΣΤ[ΗΉ]Σ?[:\s]*(\d+)\s*%/i,
    /(?:RATE|ΠΟΣΟΣΤ[ΟΌ])[:\s]*(\d+)\s*%/i
  ];

  // Total: ΣΥΝΟΛΟ, ΠΛΗΡΩΤΕΟ, ΤΕΛΙΚΟ ΠΟΣΟ, ΓΕΝΙΚΟ ΣΥΝΟΛΟ, etc.
  const totalPatterns=[
    /(?:ΣΥΝΟΛ[ΟΌ]|ΓΕΝΙΚ[ΟΌ]\s*ΣΥΝΟΛ[ΟΌ]|ΠΛΗΡΩΤ[ΕΈ]Ο|ΤΕΛΙΚ[ΟΌ]\s*(?:ΠΟΣ[ΟΌ])?|TOTAL|GRAND\s*TOTAL|ΣΥΝ\.\s*ΑΞΙΑ|ΑΞΙΑ\s*ΜΕ\s*Φ\.?\s*Π\.?\s*Α\.?)[:\s]*[€]?\s*([\d.,]+)/i
  ];

  for(const p of netPatterns){const m=allText.match(p);if(m){const v=parseFloat(norm(m[1]));if(v>0){netAmount=v;break;}}}
  for(const p of vatAmtPatterns){const m=allText.match(p);if(m){const v=parseFloat(norm(m[1]));if(v>=0){vatAmount=v;break;}}}
  for(const p of vatRatePatterns){const m=allText.match(p);if(m){const v=parseInt(m[1]);if([0,6,13,24].includes(v)){vatRate=v;break;}}}
  // Calculate missing fields
  if(netAmount!=null&&vatAmount==null){
    for(const p of totalPatterns){const m=allText.match(p);if(m){const total=parseFloat(norm(m[1]));if(total>0&&total>netAmount){vatAmount=Math.round((total-netAmount)*100)/100;break;}}}
  }
  if(netAmount!=null&&vatAmount!=null&&vatRate==null&&netAmount>0){
    const r=Math.round(vatAmount/netAmount*100);
    if([0,6,13,24].includes(r))vatRate=r;
  }
  if(netAmount==null&&vatAmount==null&&vatRate==null)return null;
  return{vatLines:[{rate:vatRate,net:netAmount,vat:vatAmount}]};
}
